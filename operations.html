<script>
(function(){
'use strict';

// ── constants ────────────────────────────────────────────────
const CAP=32, IT_DEFAULT=20;
var itLoad=IT_DEFAULT;
var ambientPeak=88; // adjustable

// virtual coordinate system
const VW=920, VH=548;

var cv=document.getElementById('cv');
var cx=cv.getContext('2d');

// ── resize ───────────────────────────────────────────────────
function resize(){
  var ctr=document.getElementById('ctr');
  cv.width=ctr.clientWidth;
  cv.height=ctr.clientHeight;
}
resize();
window.addEventListener('resize',resize);

function sc(){
  var s=Math.min(cv.width/VW,cv.height/VH);
  return {s:s,ox:(cv.width-VW*s)/2,oy:(cv.height-VH*s)/2};
}
function X(x){var r=sc();return r.ox+x*r.s;}
function Y(y){var r=sc();return r.oy+y*r.s;}
function D(v){return sc().s*v;}

// ── simulation math ──────────────────────────────────────────
function temp(h){
  var hh=h;
  if(hh<5) hh+=24;
  var x=(hh-5)/24;
  var peakx=0.458, w=0.62;
  var base=64, amp=ambientPeak-64;
  var v=Math.cos((x-peakx)/w*Math.PI); v=(v+1)/2;
  return base+amp*Math.pow(v,1.1);
}
function soc(h){
  if(h>=22) return Math.max(0,Math.min(1,0.10+(h-22)/10*0.90));
  if(h<8)   return Math.max(0,Math.min(1,0.10+(h+2)/10*0.90));
  if(h<12)  return 1;
  if(h<20)  return Math.max(0.12,Math.min(1,1-(h-12)/8*0.88));
  return 0.12;
}
function isCharge(h){return h>=22||h<8;}
function isDischarge(h){return h>=12&&h<20;}
function state(h){
  var T=temp(h);
  var coolFrac=Math.max(0,Math.min(1,(T-60)/(98-60)));
  var chRaw=4+8*coolFrac;
  var s=soc(h), charging=isCharge(h), discharging=isDischarge(h);
  var pacing=Math.min(1,s/0.15);
  var off=discharging?Math.min(chRaw-2.5,7)*pacing:0;
  var chEff=Math.max(2,chRaw-off);
  var chargeKW=0;
  if(charging){var headroom=CAP-0.6-(itLoad+chRaw);chargeKW=Math.max(0,Math.min(3.6,headroom));}
  var meter=itLoad+chEff+chargeKW;
  var freed=Math.max(0,CAP-meter);
  var nRun=Math.max(2,Math.round(chEff/12*8));
  var nRel=discharging?Math.round(off/12*8):0;
  var phase=charging?'charge':discharging?'discharge':(h>=8&&h<12?'standby':'recover');
  return {h:h,T:T,coolFrac:coolFrac,soc:s,charging:charging,discharging:discharging,
    chRaw:chRaw,chEff:chEff,chargeKW:chargeKW,meter:meter,freed:freed,off:off,
    nRun:nRun,nRel:nRel,phase:phase,chillFrac:Math.min(1,chEff/12)};
}

// ── color palette ─────────────────────────────────────────────
var C={sup:'#38bdf8',pre:'#7dd3fc',ret:'#f87171',cold:'#34d399',mix:'#22d3ee',
       warm:'#fbbf24',chg:'#60a5fa',cmd:'#a78bfa',plate:'#a5b4fc'};

// ── draw utilities ────────────────────────────────────────────
function rr(x,y,w,h,r,fill,stroke,lw){
  cx.beginPath();
  cx.moveTo(X(x+r),Y(y));
  cx.lineTo(X(x+w-r),Y(y));
  cx.quadraticCurveTo(X(x+w),Y(y),X(x+w),Y(y+r));
  cx.lineTo(X(x+w),Y(y+h-r));
  cx.quadraticCurveTo(X(x+w),Y(y+h),X(x+w-r),Y(y+h));
  cx.lineTo(X(x+r),Y(y+h));
  cx.quadraticCurveTo(X(x),Y(y+h),X(x),Y(y+h-r));
  cx.lineTo(X(x),Y(y+r));
  cx.quadraticCurveTo(X(x),Y(y),X(x+r),Y(y));
  cx.closePath();
  if(fill){cx.fillStyle=fill;cx.fill();}
  if(stroke){cx.strokeStyle=stroke;cx.lineWidth=D(lw||1);cx.setLineDash([]);cx.stroke();}
}

function t(s,x,y,col,sz,w,a){
  cx.save();
  cx.fillStyle=col||'#fff';
  cx.font=(w||'400')+' '+D(sz||9)+'px "Courier New",monospace';
  cx.textAlign=a||'center';
  cx.textBaseline='middle';
  cx.fillText(s,X(x),Y(y));
  cx.restore();
}

function glow(x,y,r,col,a){
  cx.save();
  var g=cx.createRadialGradient(X(x),Y(y),0,X(x),Y(y),D(r));
  g.addColorStop(0,col.replace('rgb','rgba').replace(')',','+(a||0.3)+')').replace('rgba(rgba','rgba('));
  // simple approach: parse and add alpha
  var ga=cx.createRadialGradient(X(x),Y(y),0,X(x),Y(y),D(r));
  ga.addColorStop(0,colA(col,a||0.3));
  ga.addColorStop(1,colA(col,0));
  cx.fillStyle=ga;
  cx.beginPath();
  cx.arc(X(x),Y(y),D(r),0,Math.PI*2);
  cx.fill();
  cx.restore();
}

function colA(hex,alpha){
  // convert hex to rgba
  var r=parseInt(hex.slice(1,3),16),
      g=parseInt(hex.slice(3,5),16),
      b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

function lerpHex(c1,c2,t2){
  var r1=parseInt(c1.slice(1,3),16), g1=parseInt(c1.slice(3,5),16), b1=parseInt(c1.slice(5,7),16);
  var r2=parseInt(c2.slice(1,3),16), g2=parseInt(c2.slice(3,5),16), b2=parseInt(c2.slice(5,7),16);
  var r=Math.round(r1+(r2-r1)*t2), g=Math.round(g1+(g2-g1)*t2), b=Math.round(b1+(b2-b1)*t2);
  return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
}

function pipe(pts,col,lw,off,alpha){
  if(pts.length<2) return;
  cx.save();
  cx.globalAlpha=alpha||1;
  cx.strokeStyle=col;
  cx.lineWidth=D(lw||4);
  cx.lineCap='round';
  cx.lineJoin='round';
  cx.setLineDash([D(8),D(5)]);
  cx.lineDashOffset=-off;
  cx.beginPath();
  cx.moveTo(X(pts[0][0]),Y(pts[0][1]));
  for(var i=1;i<pts.length;i++) cx.lineTo(X(pts[i][0]),Y(pts[i][1]));
  cx.stroke();
  cx.restore();
}

function gradPipe(pts,c1,c2,lw,off,alpha){
  if(pts.length<2) return;
  // use midpoint for gradient direction
  var x0=pts[0][0], y0=pts[0][1], x1=pts[pts.length-1][0], y1=pts[pts.length-1][1];
  var grad=cx.createLinearGradient(X(x0),Y(y0),X(x1),Y(y1));
  grad.addColorStop(0,c1);
  grad.addColorStop(1,c2);
  cx.save();
  cx.globalAlpha=alpha||1;
  cx.strokeStyle=grad;
  cx.lineWidth=D(lw||4);
  cx.lineCap='round';
  cx.lineJoin='round';
  cx.setLineDash([D(8),D(5)]);
  cx.lineDashOffset=-off;
  cx.beginPath();
  cx.moveTo(X(pts[0][0]),Y(pts[0][1]));
  for(var i=1;i<pts.length;i++) cx.lineTo(X(pts[i][0]),Y(pts[i][1]));
  cx.stroke();
  cx.restore();
}

function solidLine(pts,col,lw){
  if(pts.length<2) return;
  cx.save();
  cx.strokeStyle=col;
  cx.lineWidth=D(lw||1);
  cx.lineCap='round';
  cx.lineJoin='round';
  cx.setLineDash([]);
  cx.beginPath();
  cx.moveTo(X(pts[0][0]),Y(pts[0][1]));
  for(var i=1;i<pts.length;i++) cx.lineTo(X(pts[i][0]),Y(pts[i][1]));
  cx.stroke();
  cx.restore();
}

function arrow(x,y,ang,col,sz,alpha){
  cx.save();
  cx.globalAlpha=alpha||1;
  cx.fillStyle=col;
  cx.translate(X(x),Y(y));
  cx.rotate(ang);
  var s=D(sz||5);
  cx.beginPath();
  cx.moveTo(s,0);
  cx.lineTo(-s,-s*0.6);
  cx.lineTo(-s,s*0.6);
  cx.closePath();
  cx.fill();
  cx.restore();
}

function pump(pcx2,pcy,pr,lbl,tag,dir){
  // ISA pump circle with arrow
  cx.save();
  cx.beginPath();
  cx.arc(X(pcx2),Y(pcy),D(pr),0,Math.PI*2);
  cx.fillStyle='#060a10';
  cx.fill();
  cx.strokeStyle='#38bdf8';
  cx.lineWidth=D(1.2);
  cx.setLineDash([]);
  cx.stroke();
  // arrow inside
  var ang=(dir||0)*Math.PI/180;
  cx.fillStyle='#38bdf8';
  cx.translate(X(pcx2),Y(pcy));
  cx.rotate(ang);
  var s=D(pr*0.55);
  cx.beginPath();
  cx.moveTo(s,0);
  cx.lineTo(-s,-s*0.65);
  cx.lineTo(-s*0.3,0);
  cx.lineTo(-s,s*0.65);
  cx.closePath();
  cx.fill();
  cx.restore();
  if(lbl) t(lbl,pcx2,pcy+pr+8,'#38bdf8',7,'700');
  if(tag) t(tag,pcx2,pcy+pr+16,'#2a3d5c',6,'700');
}

function isa(x,y,fn,loop,col,r){
  var rad=r||9;
  cx.beginPath();
  cx.arc(X(x),Y(y),D(rad),0,Math.PI*2);
  cx.fillStyle='#060a10';
  cx.fill();
  cx.strokeStyle=col||'#5b7bb8';
  cx.lineWidth=D(1);
  cx.setLineDash([]);
  cx.stroke();
  if(loop){
    // double circle (field-mounted)
    cx.beginPath();
    cx.arc(X(x),Y(y),D(rad-2.5),0,Math.PI*2);
    cx.stroke();
  }
  t(fn||'',x,y-2,col||'#5b7bb8',6,'700');
  t(loop||'',x,y+3.5,col||'#5b7bb8',5,'400');
}

function actuator(x,y,col){
  // diaphragm actuator above valve
  cx.save();
  cx.fillStyle=col||'#475569';
  cx.strokeStyle=col||'#475569';
  cx.lineWidth=D(1);
  cx.setLineDash([]);
  // stem
  cx.beginPath();
  cx.moveTo(X(x),Y(y+8));
  cx.lineTo(X(x),Y(y+2));
  cx.stroke();
  // diaphragm box
  cx.beginPath();
  cx.rect(X(x-7),Y(y-8),D(14),D(10));
  cx.fillStyle='#060a10';
  cx.fill();
  cx.strokeStyle=col||'#475569';
  cx.stroke();
  // arrow down
  cx.fillStyle=col||'#475569';
  cx.beginPath();
  cx.moveTo(X(x),Y(y+2));
  cx.lineTo(X(x-3),Y(y-2));
  cx.lineTo(X(x+3),Y(y-2));
  cx.closePath();
  cx.fill();
  cx.restore();
}

// ── plate heat exchanger ──────────────────────────────────────
function hxRect(x,y,w,h,alpha){
  cx.save();
  cx.globalAlpha=alpha||1;
  if(alpha>0.2) glow(x+w/2,y+h/2,w*1.1,C.plate,alpha*0.14);
  rr(x,y,w,h,2,'#070a14',C.plate,1.8);
  cx.fillStyle='rgba(129,140,248,0.10)';
  cx.fillRect(X(x+3),Y(y+3),D(w-6),D(6));
  cx.fillRect(X(x+3),Y(y+h-9),D(w-6),D(6));
  cx.strokeStyle='rgba(129,140,248,0.30)';
  cx.lineWidth=D(0.7);
  cx.setLineDash([]);
  var plates=12;
  for(var i=1;i<plates;i++){
    var px=x+(w/plates)*i;
    cx.beginPath();
    cx.moveTo(X(px),Y(y+11));
    cx.lineTo(X(px),Y(y+h-11));
    cx.stroke();
  }
  cx.strokeStyle='rgba(129,140,248,0.35)';
  cx.lineWidth=D(0.8);
  cx.beginPath();
  cx.moveTo(X(x+5),Y(y+h/2));
  cx.lineTo(X(x+w-5),Y(y+h/2));
  cx.stroke();
  // ports at 4 corners
  [[x,y+12],[x,y+h-12],[x+w,y+12],[x+w,y+h-12]].forEach(function(pt){
    cx.beginPath();
    cx.arc(X(pt[0]),Y(pt[1]),D(4),0,Math.PI*2);
    cx.fillStyle='#0a0f18';
    cx.fill();
    cx.strokeStyle=C.plate;
    cx.lineWidth=D(1.4);
    cx.stroke();
  });
  t('PLATE HEAT EXCHANGER',x+w/2,y-11,C.plate,8,'700');
  t('HX',x+w/2,y+h/2-9,'#c7d2fe',10,'700');
  t('water ⇄ glycol',x+w/2,y+h/2+9,'#5b6db8',7,'600');
  cx.restore();
}

// ── V1 valve (3-way, charge/discharge/standby) ────────────────
function drawV1(vcx2,vcy,mode,alpha){
  var col=mode==='charge'?C.chg:mode==='discharge'?C.warm:'#475569';
  if(mode!=='standby') glow(vcx2,vcy,28,mode==='charge'?'#3b82f6':'#f59e0b',alpha*0.22);
  actuator(vcx2,vcy-18,col);
  cx.save();
  cx.globalAlpha=0.6+alpha*0.4;
  cx.fillStyle=col;
  cx.beginPath();
  cx.moveTo(X(vcx2-14),Y(vcy));
  cx.lineTo(X(vcx2),Y(vcy-10));
  cx.lineTo(X(vcx2),Y(vcy+10));
  cx.closePath();
  cx.fill();
  cx.beginPath();
  cx.moveTo(X(vcx2+14),Y(vcy));
  cx.lineTo(X(vcx2),Y(vcy-10));
  cx.lineTo(X(vcx2),Y(vcy+10));
  cx.closePath();
  cx.fill();
  cx.strokeStyle=col;
  cx.lineWidth=D(2);
  cx.setLineDash([]);
  cx.beginPath();
  cx.moveTo(X(vcx2),Y(vcy-10));
  cx.lineTo(X(vcx2),Y(vcy-18));
  cx.stroke();
  cx.beginPath();
  cx.arc(X(vcx2),Y(vcy),D(18),0,Math.PI*2);
  cx.strokeStyle=col;
  cx.lineWidth=D(1);
  cx.stroke();
  cx.beginPath();
  cx.arc(X(vcx2),Y(vcy),D(3.5),0,Math.PI*2);
  cx.fillStyle='#0a0f18';
  cx.fill();
  cx.strokeStyle=col;
  cx.lineWidth=D(1);
  cx.stroke();
  cx.restore();
  t('V1',vcx2,vcy,'#e2e8f0',7,'700');
  var ml=mode==='charge'?'CHARGE':mode==='discharge'?'DISCH':'STBY';
  t(ml,vcx2,vcy+27,col,8,'700');
  t('FV-101',vcx2,vcy+37,'#2a3d5c',6,'700');
}

// ── V2 valve (3-way mixing) ───────────────────────────────────
function drawV2(vcx2,vcy,alpha,mixPct){
  var col=alpha>0.3?'#a78bfa':'#475569';
  if(alpha>0.3) glow(vcx2,vcy,26,'#8b5cf6',alpha*0.22);
  actuator(vcx2,vcy-18,col);
  cx.save();
  cx.globalAlpha=0.6+alpha*0.4;
  cx.fillStyle=alpha>0.3?C.cold:col;
  cx.beginPath();
  cx.moveTo(X(vcx2+14),Y(vcy));
  cx.lineTo(X(vcx2+2),Y(vcy-9));
  cx.lineTo(X(vcx2+2),Y(vcy+9));
  cx.closePath();
  cx.fill();
  cx.fillStyle=alpha>0.3?C.warm:col;
  cx.beginPath();
  cx.moveTo(X(vcx2),Y(vcy+14));
  cx.lineTo(X(vcx2-7),Y(vcy+2));
  cx.lineTo(X(vcx2+7),Y(vcy+2));
  cx.closePath();
  cx.fill();
  cx.fillStyle=alpha>0.3?C.mix:col;
  cx.beginPath();
  cx.moveTo(X(vcx2-14),Y(vcy));
  cx.lineTo(X(vcx2-2),Y(vcy-9));
  cx.lineTo(X(vcx2-2),Y(vcy+9));
  cx.closePath();
  cx.fill();
  cx.beginPath();
  cx.arc(X(vcx2),Y(vcy),D(18),0,Math.PI*2);
  cx.strokeStyle=col;
  cx.lineWidth=D(1);
  cx.stroke();
  cx.beginPath();
  cx.arc(X(vcx2),Y(vcy),D(3.5),0,Math.PI*2);
  cx.fillStyle='#0a0f18';
  cx.fill();
  cx.strokeStyle=col;
  cx.lineWidth=D(1);
  cx.stroke();
  cx.restore();
  t('V2',vcx2,vcy,'#e2e8f0',7,'700');
  t('MIX',vcx2,vcy+27,col,8,'700');
  t('FV-102',vcx2,vcy+37,'#2a3d5c',6,'700');
}

// ── meter arc gauge ───────────────────────────────────────────
function drawMeterArc(x,y,r,val,mn,mx,tgt,cap,label){
  var a0=-148, a1=148;
  function ra(a){return (a-90)*Math.PI/180;}
  var fracVal=Math.min(1,Math.max(0,(val-mn)/(mx-mn)));
  var va=a0+(fracVal)*(a1-a0);
  var col=val>=cap-0.5?C.ret:val>=tgt?C.warm:C.cold;
  cx.save();
  cx.strokeStyle='#0d1a2a';
  cx.lineWidth=D(9);
  cx.lineCap='round';
  cx.setLineDash([]);
  cx.beginPath();
  cx.arc(X(x),Y(y),D(r),ra(a0),ra(a1));
  cx.stroke();
  cx.strokeStyle=col;
  cx.beginPath();
  cx.arc(X(x),Y(y),D(r),ra(a0),ra(va));
  cx.stroke();
  // target tick
  var ta=a0+((tgt-mn)/(mx-mn))*(a1-a0);
  var tick_x=x+r*Math.cos((ta-90)*Math.PI/180);
  var tick_y=y+r*Math.sin((ta-90)*Math.PI/180);
  cx.strokeStyle=C.warm;
  cx.lineWidth=D(1.5);
  cx.beginPath();
  cx.moveTo(X(tick_x-3),Y(tick_y-3));
  cx.lineTo(X(tick_x+3),Y(tick_y+3));
  cx.stroke();
  cx.restore();
  t(val.toFixed(1),x,y,col,22,'700');
  t('MW',x+16,y+3,col,8,'700','left');
  t(label,x,y+20,'#2a3d5c',7,'600');
}

// ── main draw function ────────────────────────────────────────
function drawAll(h,st,fW,fG,fC){
  // background
  cx.fillStyle='#0d1117';
  cx.fillRect(0,0,cv.width,cv.height);

  // ── COMPONENT POSITIONS ──────────────────────────────────────
  // Left column
  var chillerX=12, chillerY=28, chillerW=170, chillerH=92;
  var meterX2=12, meterY2=140, meterW=170, meterH=128;
  var dcX=12, dcY=290, dcW=170, dcH=110;

  // Center
  var hxX=320, hxY=235, hxW=120, hxH=90;
  var v1X=700, v1Y=290;
  var v2X=486, v2Y=242;

  // Right column
  var optX=525, optY=28, optW=370, optH=98;
  var nchX=525, nchY=140, nchW=170, nchH=90;
  var icesX=715, icesY=148, icesW=180, icesH=310;

  // ── TES BOUNDING BOX ─────────────────────────────────────────
  rr(708,138,196,330,6,'rgba(3,7,18,0.7)','rgba(52,211,153,0.25)',1.2);
  t('NOSTROMO TES SYSTEM',806,130,'rgba(52,211,153,0.55)',7.5,'700');

  // ── PIPE ROUTING ─────────────────────────────────────────────
  var aW=st.charging?0.9:0.08;    // water supply / return alpha when charging
  var aD=st.discharging?0.9:0.08; // glycol discharge alpha
  var aG=0.85;                    // always-on building water
  var aC=st.charging?0.9:0.08;    // charge loop

  // Water supply pipe (blue, left loop down-left side)
  pipe([[182,100],[205,100],[205,310],[182,310]],C.sup,4,fW,aG);
  // arrow on supply
  arrow(205,200,Math.PI/2,C.sup,5,aG);

  // Water return (red, left loop up-left side)
  pipe([[182,378],[260,378],[320,378],[320,313]],C.ret,4,fW*0.9,aG);
  pipe([[320,247],[320,65],[182,65]],C.pre,4,fW*0.9,aG);
  arrow(260,378,0,C.ret,5,aG);
  arrow(320,155,3*Math.PI/2,C.pre,5,aG);

  // HX precool water out to chiller array (cold)
  pipe([[320,247],[320,200],[240,200],[182,200]],C.cold,4,fW,aG*0.8);
  arrow(280,200,Math.PI,C.cold,5,aG*0.8);

  // Glycol discharge: IceBricks cold port → V1 → V2 → HX
  var v1PortX=715+20, v1PortY=290;
  pipe([[715,290],[700,290]],C.cold,4,fG,aD);
  // V1 → up to V2
  pipe([[700,272],[700,242],[504,242]],C.cold,4,fG,aD);
  arrow(600,242,Math.PI,C.cold,5,aD);
  // V2 → HX (west port of HX)
  pipe([[468,242],[440,242],[440,280],[320,280],[320,313]],C.mix,4,fG,aD);
  arrow(380,280,Math.PI,C.mix,5,aD);

  // HX glycol bypass (warm out of HX bottom → V2 south)
  pipe([[320,325],[320,378],[486,378],[486,260]],C.warm,4,fG,aD*0.8);
  arrow(400,378,0,C.warm,5,aD*0.8);

  // Charge loop: N.Chiller → P4 → V1 → IceBricks cold port
  pipe([[695,195],[695,242],[700,242],[700,272]],C.chg,4,fC,aC);
  arrow(695,220,Math.PI/2,C.chg,5,aC);
  // IceBricks warm return → N.Chiller
  pipe([[715,230],[695,230],[695,195]],C.warm,4,fC*0.85,aC*0.7);

  // Optimizer signal dashes (cmd color, thin)
  cx.save();
  cx.strokeStyle=C.cmd;
  cx.lineWidth=D(1);
  cx.setLineDash([D(3),D(4)]);
  cx.lineDashOffset=-(fC*0.5);
  cx.globalAlpha=0.4;
  cx.beginPath();
  cx.moveTo(X(optX+optW/2),Y(optY+optH));
  cx.lineTo(X(optX+optW/2),Y(nchY));
  cx.stroke();
  cx.beginPath();
  cx.moveTo(X(optX+optW/2),Y(optY+optH));
  cx.lineTo(X(v1X),Y(v1Y-24));
  cx.stroke();
  cx.restore();

  // ── ISA INSTRUMENTS ──────────────────────────────────────────
  isa(182,52,'FT','101',C.sup,8);
  isa(182,385,'FT','102',C.ret,8);
  isa(440,310,'TT','201',C.cold,8);
  isa(440,345,'PT','202',C.plate,8);
  isa(760,290,'TT','301',C.warm,8);

  // ── PUMPS ────────────────────────────────────────────────────
  pump(182,100,10,'P1','','270');
  pump(182,340,10,'P2','','90');
  pump(695,185,9,'P4','','270');

  // ── HX ───────────────────────────────────────────────────────
  hxRect(hxX,hxY,hxW,hxH,1);

  // ── VALVES ───────────────────────────────────────────────────
  var v1Mode=st.charging?'charge':st.discharging?'discharge':'standby';
  drawV1(v1X,v1Y,v1Mode,1);
  drawV2(v2X,v2Y,st.discharging?0.9:0.3,0.5);

  // ── CHILLER ARRAY (left, customer side) ──────────────────────
  rr(chillerX,chillerY,chillerW,chillerH,6,'#060c18','#334155',1.2);
  t('CHILLER ARRAY',chillerX+chillerW/2,chillerY+9,'#94a3b8',10,'700');
  t('12 UNITS · N+1',chillerX+chillerW/2,chillerY+20,'#334155',7,'600');
  // draw chiller units (12 units in 2 rows, 6 each)
  var totalUnits=12;
  var onUnits=st.nRun;
  var relUnits=st.nRel;
  var cols=6, rows=2;
  var uW=(chillerW-12)/(cols+0.2), uH=(chillerH-32)/rows;
  for(var row=0;row<rows;row++){
    for(var col=0;col<cols;col++){
      var ui=row*cols+col;
      var ux=chillerX+6+col*(uW+2);
      var uy=chillerY+28+row*(uH+3);
      var isOn=ui<onUnits;
      var isRel=ui>=onUnits&&ui<onUnits+relUnits;
      var bg=isRel?'rgba(52,211,153,0.15)':isOn?'rgba(248,113,113,0.15)':'#0a1018';
      var bdr=isRel?C.cold:isOn?C.ret:'#1e2d3d';
      rr(ux,uy,uW,uH,2,bg,bdr,0.8);
      // fan arc
      cx.save();
      cx.beginPath();
      cx.arc(X(ux+uW/2),Y(uy+uH/2),D(uH/2-2),0,Math.PI*2);
      cx.strokeStyle=isRel?'rgba(52,211,153,0.5)':isOn?'rgba(248,113,113,0.5)':'#1e2d3d';
      cx.lineWidth=D(0.8);
      cx.setLineDash([]);
      cx.stroke();
      cx.restore();
    }
  }
  // chiller temp labels
  t('60°F SUPPLY',chillerX+chillerW/2,chillerY+chillerH-8,'#38bdf8',7.5,'700');

  // ── MAIN METER (left center) ──────────────────────────────────
  rr(meterX2,meterY2,meterW,meterH,6,'#060c18','#1d4ed8',1.4);
  t('MAIN METER',meterX2+meterW/2,meterY2+10,'#93c5fd',10,'700');
  t('SITE POWER · 32 MW CAP',meterX2+meterW/2,meterY2+22,'#1e3a5f',7,'600');
  // arc gauge
  drawMeterArc(meterX2+meterW/2,meterY2+72,36,st.meter,0,CAP,31.5,CAP,'METER MW');
  // breakdown rows
  var bx=meterX2+8, bw=meterW-16, by=meterY2+102;
  // IT bar
  var itFrac=itLoad/CAP;
  rr(bx,by,bw*itFrac,8,1,'rgba(56,189,248,0.2)','#38bdf8',0.5);
  t('IT '+itLoad.toFixed(1),meterX2+meterW/2,by+4,'#38bdf8',7,'700');
  // cooling bar
  var chFrac=st.chEff/CAP;
  var chBx=bx+bw*itFrac;
  rr(chBx,by+10,Math.max(0,bw*chFrac),8,1,'rgba(248,113,113,0.2)','#f87171',0.5);
  t('COOL '+st.chEff.toFixed(1),meterX2+meterW/2,by+14,'#f87171',7,'700');

  // freed caption
  if(st.freed>0.5){
    t('+'+st.freed.toFixed(1)+' MW freed',meterX2+meterW/2,meterY2+meterH-8,C.cold,7.5,'700');
  }

  // ── DATA CENTER (left bottom) ─────────────────────────────────
  rr(dcX,dcY,dcW,dcH,6,'#060c18','#334155',1.2);
  t('DATA CENTER',dcX+dcW/2,dcY+10,'#94a3b8',10,'700');
  // 4 racks
  for(var ri=0;ri<4;ri++){
    var rackX=dcX+8+ri*(dcW-16)/4+1;
    var rackY=dcY+22;
    var rackW=(dcW-20)/4;
    var rackH=dcH-38;
    var heat=st.coolFrac;
    var rCol=lerpHex('#1e3a5f','#7f1d1d',heat);
    rr(rackX,rackY,rackW,rackH,2,rCol,'#334155',0.6);
    // chips
    for(var ci=0;ci<4;ci++){
      var chipY=rackY+4+ci*(rackH-8)/4;
      var chipCol=lerpHex(C.cold,C.ret,heat);
      rr(rackX+2,chipY,rackW-4,6,1,chipCol,chipCol,0);
    }
  }
  t('60°F SUPPLY  /  70°F RETURN',dcX+dcW/2,dcY+dcH-8,'#475569',7,'600');

  // ── OPTIMIZER BOX (top right) ─────────────────────────────────
  rr(optX,optY,optW,optH,6,'#070a14',C.cmd,1.4);
  // glow
  glow(optX+optW/2,optY+optH/2,optW*0.6,C.cmd,0.07);
  t('OPTIMIZER',optX+optW/2,optY+12,C.cmd,11,'700');
  t('NOSTROMO DISPATCH ENGINE',optX+optW/2,optY+24,'#4c1d95',7.5,'600');
  // status tags
  var dispLine='PHASE: '+st.phase.toUpperCase()+'   SOC: '+Math.round(st.soc*100)+'%   METER: '+st.meter.toFixed(1)+' MW';
  t(dispLine,optX+optW/2,optY+40,C.cmd,7.5,'700');
  t('IT: '+itLoad.toFixed(1)+' MW   COOL: '+st.chEff.toFixed(1)+' MW   CAP: '+CAP+' MW   FREED: '+st.freed.toFixed(1)+' MW',
    optX+optW/2,optY+55,'#5b21b6',7,'600');
  t('CHARGE WINDOW: 22:00–08:00   DISCHARGE: 12:00–20:00',optX+optW/2,optY+70,'#3b1764',7,'600');
  // outer border glow
  cx.save();
  cx.strokeStyle=C.cmd;
  cx.lineWidth=D(0.5);
  cx.globalAlpha=0.3+0.2*Math.sin(Date.now()/1200);
  cx.setLineDash([D(4),D(6)]);
  rr(optX-2,optY-2,optW+4,optH+4,7,null,C.cmd,0.5);
  cx.restore();

  // ── NOSTROMO GLYCOL CHILLER ───────────────────────────────────
  rr(nchX,nchY,nchW,nchH,6,'#060c18',st.charging?C.chg:'#334155',1.4);
  t('N. GLYCOL CHILLER',nchX+nchW/2,nchY+10,'#a5b4fc',10,'700');
  // condenser row
  rr(nchX+6,nchY+20,nchW-12,18,2,'#0a1018','#1e3050',0.7);
  t('CONDENSER',nchX+nchW/2,nchY+30,'#475569',7,'600');
  // compressor circle
  cx.beginPath();
  cx.arc(X(nchX+nchW/2),Y(nchY+54),D(13),0,Math.PI*2);
  cx.fillStyle='#0a1018';
  cx.fill();
  cx.strokeStyle=st.charging?C.chg:'#334155';
  cx.lineWidth=D(1.2);
  cx.setLineDash([]);
  cx.stroke();
  t('COMP',nchX+nchW/2,nchY+54,'#94a3b8',6.5,'700');
  // evaporator row
  rr(nchX+6,nchY+70,nchW-12,14,2,'#0a1018',st.charging?'rgba(96,165,250,0.4)':'#1e3050',0.7);
  t('EVAPORATOR',nchX+nchW/2,nchY+78,'#475569',7,'600');
  // charging animation indicator
  if(st.charging){
    glow(nchX+nchW/2,nchY+nchH/2,60,C.chg,0.12);
  }

  // ── ICEBRICKS TES ─────────────────────────────────────────────
  var shimmer=0.26+st.soc*0.16+0.06*Math.sin(Date.now()/700);
  var tesGlowCol=st.discharging?C.cold:st.charging?C.chg:'#334155';
  if(st.discharging||st.charging) glow(icesX+icesW/2,icesY+icesH/2,icesW*0.7,tesGlowCol,0.14);
  rr(icesX,icesY,icesW,icesH,6,'#060c18',tesGlowCol,1.4);
  t('ICEBRICKS TES',icesX+icesW/2,icesY+12,'#5eead4',11,'700');
  t('15 TRh CAPACITY',icesX+icesW/2,icesY+24,'#134e4a',7,'600');

  // level fill
  var fillH=st.soc*(icesH-38);
  var fillY=icesY+icesH-6-fillH;
  // fill gradient
  var fillGrad=cx.createLinearGradient(X(icesX+8),Y(fillY),X(icesX+8),Y(fillY+fillH));
  fillGrad.addColorStop(0,'rgba(34,211,238,'+shimmer+')');
  fillGrad.addColorStop(1,'rgba(52,211,153,'+(shimmer*0.6)+')');
  cx.save();
  cx.globalAlpha=1;
  // clip to TES box interior
  cx.beginPath();
  cx.rect(X(icesX+4),Y(icesY+32),D(icesW-8),D(icesH-38));
  cx.clip();
  cx.fillStyle=fillGrad;
  cx.fillRect(X(icesX+4),Y(fillY),D(icesW-8),D(fillH));
  // ice grid lines
  cx.strokeStyle='rgba(13,26,42,0.4)';
  cx.lineWidth=D(0.8);
  cx.setLineDash([]);
  for(var gx2=icesX+4;gx2<icesX+icesW-4;gx2+=28){
    cx.beginPath();
    cx.moveTo(X(gx2),Y(icesY+32));
    cx.lineTo(X(gx2),Y(icesY+icesH-6));
    cx.stroke();
  }
  for(var gy2=icesY+32;gy2<icesY+icesH-6;gy2+=28){
    cx.beginPath();
    cx.moveTo(X(icesX+4),Y(gy2));
    cx.lineTo(X(icesX+icesW-4),Y(gy2));
    cx.stroke();
  }
  // shimmer line at top of fill
  if(fillH>5){
    cx.strokeStyle='rgba(167,243,208,0.7)';
    cx.lineWidth=D(1.5);
    cx.beginPath();
    cx.moveTo(X(icesX+4),Y(fillY));
    cx.lineTo(X(icesX+icesW-4),Y(fillY));
    cx.stroke();
  }
  cx.restore();

  // SOC percentage text
  var socPct2=Math.round(st.soc*100);
  t(socPct2+'%',icesX+icesW/2,icesY+icesH/2-8,'#ffffff',22,'700');
  t('STATE OF CHARGE',icesX+icesW/2,icesY+icesH/2+10,'#94a3b8',7,'600');

  // port indicators
  [[icesX,icesY+icesH*0.35],[icesX,icesY+icesH*0.65],
   [icesX+icesW,icesY+icesH*0.35],[icesX+icesW,icesY+icesH*0.65]].forEach(function(pt,pi){
    cx.beginPath();
    cx.arc(X(pt[0]),Y(pt[1]),D(4),0,Math.PI*2);
    cx.fillStyle='#0a0f18';
    cx.fill();
    cx.strokeStyle=pi<2?C.cold:C.warm;
    cx.lineWidth=D(1.2);
    cx.setLineDash([]);
    cx.stroke();
  });

  // state label at bottom
  var tesLbl=st.charging?'CHARGING':st.discharging?'DISCHARGING':'HOLDING';
  var tesLblCol=st.charging?C.chg:st.discharging?C.cold:'#334155';
  t(tesLbl,icesX+icesW/2,icesY+icesH-10,tesLblCol,8,'700');

  // ── TEMPERATURE LABELS ON PIPES ────────────────────────────────
  t('45°F',205,175,C.sup,8.5,'700');
  t('54°F',205,270,C.ret,8.5,'700');
  t('32°F',750,290,C.cold,8.5,'700');
  t('82°F',486,310,C.warm,8.5,'700');
  t(Math.round(st.T)+'°F',900,55,C.warm,9,'700');

  // ── FOOTER / COLOR KEY ─────────────────────────────────────────
  var fkeys=[
    {col:C.sup,label:'WATER SUPPLY'},
    {col:C.ret,label:'WATER RETURN'},
    {col:C.cold,label:'COLD GLYCOL'},
    {col:C.warm,label:'WARM GLYCOL'},
    {col:C.chg,label:'CHARGE LOOP'},
    {col:C.cmd,label:'OPTIMIZER'},
    {col:C.plate,label:'HX / PLATE'}
  ];
  var fkStartX=12, fkY=543, fkSpacing=128;
  fkeys.forEach(function(fk,fi){
    var kx=fkStartX+fi*fkSpacing;
    cx.save();
    cx.fillStyle=fk.col;
    cx.fillRect(X(kx),Y(fkY-2),D(18),D(4));
    cx.restore();
    t(fk.label,kx+22,fkY,fk.col,7.5,'600','left');
  });
}

// ── HUD UPDATE ────────────────────────────────────────────────
function updateHUD(h,st){
  var hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  document.getElementById('clock').textContent=
    String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  var scrub2=document.getElementById('scrub');
  scrub2.value=Math.round(h/24*9999);

  var badge=document.getElementById('badge');
  var phases={
    charge:{text:'CHARGING',bg:'rgba(6,182,212,.15)',border:'#22d3ee',col:'#22d3ee'},
    discharge:{text:'DISCHARGING',bg:'rgba(20,184,166,.15)',border:'#14B8A6',col:'#14B8A6'},
    standby:{text:'STANDBY',bg:'rgba(255,255,255,.03)',border:'#14213a',col:'#14213a'},
    recover:{text:'RESETTING',bg:'rgba(249,115,22,.12)',border:'#f97316',col:'#f97316'}
  };
  var p=phases[st.phase]||phases.standby;
  badge.textContent=p.text;
  badge.style.background=p.bg;
  badge.style.borderColor=p.border;
  badge.style.color=p.col;
}

// ── ANIMATION LOOP ────────────────────────────────────────────
var fW=0, fG=0, fC=0;
var progress=0, playing=false, speed=2, last2=0;

function loop(now){
  requestAnimationFrame(loop);
  if(playing){
    var dt=(now-last2)/1000;
    last2=now;
    progress+=dt*speed*0.022;
    if(progress>=1) progress-=1;
  } else {
    last2=now;
  }
  fW+=0.38; fG+=0.35; fC+=0.32;

  var h=progress*24;
  var st=state(h);
  drawAll(h,st,fW,fG,fC);
  updateHUD(h,st);
}
requestAnimationFrame(loop);

// ── CONTROLS ──────────────────────────────────────────────────
var playbtn=document.getElementById('playbtn');
playbtn.addEventListener('click',function(){
  playing=!playing;
  playbtn.textContent=playing?'⏸ PAUSE':'▶ PLAY';
  if(playing) last2=performance.now();
});

function setSpeed(s){
  speed=s;
  ['s1btn','s2btn','s4btn'].forEach(function(id){
    var el=document.getElementById(id);
    el.style.color='#5b7bb8';
    el.style.borderColor='#1e3050';
  });
  var active=document.getElementById('s'+s+'btn');
  active.style.color='#a78bfa';
  active.style.borderColor='#3b2a6a';
}
document.getElementById('s1btn').addEventListener('click',function(){setSpeed(1);});
document.getElementById('s2btn').addEventListener('click',function(){setSpeed(2);});
document.getElementById('s4btn').addEventListener('click',function(){setSpeed(4);});

// scrub
var scrubEl=document.getElementById('scrub');
scrubEl.addEventListener('input',function(){
  progress=parseInt(this.value)/9999;
  if(!playing) last2=performance.now();
});

// sliders
var siEl=document.getElementById('si');
var saEl=document.getElementById('sa');
siEl.addEventListener('input',function(){
  itLoad=parseFloat(this.value);
  document.getElementById('li').textContent=itLoad.toFixed(1)+' MW';
});
saEl.addEventListener('input',function(){
  ambientPeak=parseInt(this.value);
  document.getElementById('la').textContent=ambientPeak+'°F';
});

// start playing after a brief pause
setTimeout(function(){
  playing=true;
  last2=performance.now();
  playbtn.textContent='⏸ PAUSE';
},600);

})();
</script>
