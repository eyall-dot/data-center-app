<script>
(function(){
'use strict';

// ── constants ────────────────────────────────────────────────
const CAP=32, IT_DEFAULT=20;
var itLoad=IT_DEFAULT;
var ambientPeak=88;

// virtual coordinate system
const VW=920, VH=548;

var cv=document.getElementById('cv');
var cx=cv.getContext('2d');

// ── cooling mode toggle ───────────────────────────────────────
var coolingMode='crah'; // 'crah' or 'dlc'
document.getElementById('coolbtn').addEventListener('click',function(){
  coolingMode=coolingMode==='crah'?'dlc':'crah';
  this.textContent=coolingMode.toUpperCase();
  this.style.color=coolingMode==='crah'?'#34d399':'#a78bfa';
  this.style.borderColor=coolingMode==='crah'?'#065f46':'#3b2a6a';
});

// ── resize ───────────────────────────────────────────────────
function resize(){
  var ctr=document.getElementById('ctr');
  cv.width=ctr.clientWidth;
  cv.height=ctr.clientHeight;
}
resize();
window.addEventListener('resize',resize);

function sc(){
  var s=Math.min(cv.width/VW,cv.height/VH);
  return {s:s,ox:(cv.width-VW*s)/2,oy:(cv.height-VH*s)/2};
}
function X(x){var r=sc();return r.ox+x*r.s;}
function Y(y){var r=sc();return r.oy+y*r.s;}
function D(v){return sc().s*v;}

// ── simulation math ──────────────────────────────────────────
function temp(h){
  var hh=h;
  if(hh<5) hh+=24;
  var x=(hh-5)/24;
  var peakx=0.458, w=0.62;
  var base=64, amp=ambientPeak-64;
  var v=Math.cos((x-peakx)/w*Math.PI); v=(v+1)/2;
  return base+amp*Math.pow(v,1.1);
}
function soc(h){
  if(h>=22) return Math.max(0,Math.min(1,0.10+(h-22)/10*0.90));
  if(h<8)   return Math.max(0,Math.min(1,0.10+(h+2)/10*0.90));
  if(h<12)  return 1;
  if(h<20)  return Math.max(0.12,Math.min(1,1-(h-12)/8*0.88));
  return 0.12;
}
function isCharge(h){return h>=22||h<8;}
function isDischarge(h){return h>=12&&h<20;}
function state(h){
  var T=temp(h);
  var coolFrac=Math.max(0,Math.min(1,(T-60)/(98-60)));
  var chRaw=4+8*coolFrac;
  var s=soc(h), charging=isCharge(h), discharging=isDischarge(h);
  var pacing=Math.min(1,s/0.15);
  var off=discharging?Math.min(chRaw-2.5,7)*pacing:0;
  var chEff=Math.max(2,chRaw-off);
  var chargeKW=0;
  if(charging){var headroom=CAP-0.6-(itLoad+chRaw);chargeKW=Math.max(0,Math.min(3.6,headroom));}
  var meter=itLoad+chEff+chargeKW;
  var freed=Math.max(0,CAP-meter);
  var nRun=Math.max(2,Math.round(chEff/12*8));
  var nRel=discharging?Math.round(off/12*8):0;
  var phase=charging?'charge':discharging?'discharge':(h>=8&&h<12?'standby':'recover');
  return {h:h,T:T,coolFrac:coolFrac,soc:s,charging:charging,discharging:discharging,
    chRaw:chRaw,chEff:chEff,chargeKW:chargeKW,meter:meter,freed:freed,off:off,
    nRun:nRun,nRel:nRel,phase:phase,chillFrac:Math.min(1,chEff/12)};
}

// ── color palette ─────────────────────────────────────────────
var C={sup:'#38bdf8',pre:'#7dd3fc',ret:'#f87171',cold:'#34d399',mix:'#22d3ee',
       warm:'#fbbf24',chg:'#60a5fa',cmd:'#a78bfa',plate:'#a5b4fc'};

// ── draw utilities ────────────────────────────────────────────
function rr(x,y,w,h,r,fill,stroke,lw){
  cx.beginPath();
  cx.moveTo(X(x+r),Y(y));
  cx.lineTo(X(x+w-r),Y(y));
  cx.quadraticCurveTo(X(x+w),Y(y),X(x+w),Y(y+r));
  cx.lineTo(X(x+w),Y(y+h-r));
  cx.quadraticCurveTo(X(x+w),Y(y+h),X(x+w-r),Y(y+h));
  cx.lineTo(X(x+r),Y(y+h));
  cx.quadraticCurveTo(X(x),Y(y+h),X(x),Y(y+h-r));
  cx.lineTo(X(x),Y(y+r));
  cx.quadraticCurveTo(X(x),Y(y),X(x+r),Y(y));
  cx.closePath();
  if(fill){cx.fillStyle=fill;cx.fill();}
  if(stroke){cx.strokeStyle=stroke;cx.lineWidth=D(lw||1);cx.setLineDash([]);cx.stroke();}
}

function t(s,x,y,col,sz,w,a){
  cx.save();
  cx.fillStyle=col||'#fff';
  cx.font=(w||'400')+' '+D(sz||9)+'px "Outfit","Segoe UI",system-ui,sans-serif';
  cx.textAlign=a||'center';
  cx.textBaseline='middle';
  cx.fillText(s,X(x),Y(y));
  cx.restore();
}
function tm(s,x,y,col,sz,w,a){
  cx.save();
  cx.fillStyle=col||'#fff';
  cx.font=(w||'400')+' '+D(sz||9)+'px "JetBrains Mono","Courier New",monospace';
  cx.textAlign=a||'center';
  cx.textBaseline='middle';
  cx.fillText(s,X(x),Y(y));
  cx.restore();
}

function glow(x,y,r,col,a){
  cx.save();
  var ga=cx.createRadialGradient(X(x),Y(y),0,X(x),Y(y),D(r));
  ga.addColorStop(0,colA(col,a||0.3));
  ga.addColorStop(1,colA(col,0));
  cx.fillStyle=ga;
  cx.beginPath();
  cx.arc(X(x),Y(y),D(r),0,Math.PI*2);
  cx.fill();
  cx.restore();
}

function colA(hex,alpha){
  var r=parseInt(hex.slice(1,3),16),
      g=parseInt(hex.slice(3,5),16),
      b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

function lerpHex(c1,c2,t2){
  var r1=parseInt(c1.slice(1,3),16), g1=parseInt(c1.slice(3,5),16), b1=parseInt(c1.slice(5,7),16);
  var r2=parseInt(c2.slice(1,3),16), g2=parseInt(c2.slice(3,5),16), b2=parseInt(c2.slice(5,7),16);
  var r=Math.round(r1+(r2-r1)*t2), g=Math.round(g1+(g2-g1)*t2), b=Math.round(b1+(b2-b1)*t2);
  return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
}

function pipe(pts,col,lw,off,alpha){
  if(pts.length<2) return;
  cx.save();
  cx.globalAlpha=alpha||1;
  cx.strokeStyle=col;
  cx.lineWidth=D(lw||4);
  cx.lineCap='round';
  cx.lineJoin='round';
  cx.setLineDash([D(8),D(5)]);
  cx.lineDashOffset=-off;
  cx.beginPath();
  cx.moveTo(X(pts[0][0]),Y(pts[0][1]));
  for(var i=1;i<pts.length;i++) cx.lineTo(X(pts[i][0]),Y(pts[i][1]));
  cx.stroke();
  cx.restore();
}

function solidLine(pts,col,lw){
  if(pts.length<2) return;
  cx.save();
  cx.strokeStyle=col;
  cx.lineWidth=D(lw||1);
  cx.lineCap='round';
  cx.lineJoin='round';
  cx.setLineDash([]);
  cx.beginPath();
  cx.moveTo(X(pts[0][0]),Y(pts[0][1]));
  for(var i=1;i<pts.length;i++) cx.lineTo(X(pts[i][0]),Y(pts[i][1]));
  cx.stroke();
  cx.restore();
}

function arrow(x,y,ang,col,sz,alpha){
  cx.save();
  cx.globalAlpha=alpha||1;
  cx.fillStyle=col;
  cx.translate(X(x),Y(y));
  cx.rotate(ang);
  var s=D(sz||5);
  cx.beginPath();
  cx.moveTo(s,0);
  cx.lineTo(-s,-s*0.6);
  cx.lineTo(-s,s*0.6);
  cx.closePath();
  cx.fill();
  cx.restore();
}

function pump(pcx2,pcy,pr,lbl,tag,dir){
  cx.save();
  cx.beginPath();
  cx.arc(X(pcx2),Y(pcy),D(pr),0,Math.PI*2);
  cx.fillStyle='#060a10';
  cx.fill();
  cx.strokeStyle='#38bdf8';
  cx.lineWidth=D(1.2);
  cx.setLineDash([]);
  cx.stroke();
  var ang=(dir||0)*Math.PI/180;
  cx.fillStyle='#38bdf8';
  cx.translate(X(pcx2),Y(pcy));
  cx.rotate(ang);
  var s=D(pr*0.55);
  cx.beginPath();
  cx.moveTo(s,0);
  cx.lineTo(-s,-s*0.65);
  cx.lineTo(-s*0.3,0);
  cx.lineTo(-s,s*0.65);
  cx.closePath();
  cx.fill();
  cx.restore();
  if(lbl) t(lbl,pcx2,pcy+pr+8,'#38bdf8',7,'700');
  if(tag) t(tag,pcx2,pcy+pr+16,'#2a3d5c',6,'700');
}

function isa(x,y,fn,loop,col,r){
  var rad=r||9;
  cx.beginPath();
  cx.arc(X(x),Y(y),D(rad),0,Math.PI*2);
  cx.fillStyle='#060a10';
  cx.fill();
  cx.strokeStyle=col||'#5b7bb8';
  cx.lineWidth=D(1);
  cx.setLineDash([]);
  cx.stroke();
  if(loop){
    cx.beginPath();
    cx.arc(X(x),Y(y),D(rad-2.5),0,Math.PI*2);
    cx.stroke();
  }
  t(fn||'',x,y-2,col||'#5b7bb8',6,'700');
  t(loop||'',x,y+3.5,col||'#5b7bb8',5,'400');
}

function actuator(x,y,col){
  cx.save();
  cx.fillStyle=col||'#475569';
  cx.strokeStyle=col||'#475569';
  cx.lineWidth=D(1);
  cx.setLineDash([]);
  cx.beginPath();
  cx.moveTo(X(x),Y(y+8));
  cx.lineTo(X(x),Y(y+2));
  cx.stroke();
  cx.beginPath();
  cx.rect(X(x-7),Y(y-8),D(14),D(10));
  cx.fillStyle='#060a10';
  cx.fill();
  cx.strokeStyle=col||'#475569';
  cx.stroke();
  cx.fillStyle=col||'#475569';
  cx.beginPath();
  cx.moveTo(X(x),Y(y+2));
  cx.lineTo(X(x-3),Y(y-2));
  cx.lineTo(X(x+3),Y(y-2));
  cx.closePath();
  cx.fill();
  cx.restore();
}

// ── plate heat exchanger ──────────────────────────────────────
function hxRect(x,y,w,h,alpha){
  cx.save();
  cx.globalAlpha=alpha||1;
  if(alpha>0.2) glow(x+w/2,y+h/2,w*1.1,C.plate,alpha*0.14);
  rr(x,y,w,h,2,'#070a14',C.plate,1.8);
  cx.fillStyle='rgba(129,140,248,0.10)';
  cx.fillRect(X(x+3),Y(y+3),D(w-6),D(6));
  cx.fillRect(X(x+3),Y(y+h-9),D(w-6),D(6));
  cx.strokeStyle='rgba(129,140,248,0.30)';
  cx.lineWidth=D(0.7);
  cx.setLineDash([]);
  var plates=10;
  for(var i=1;i<plates;i++){
    var px=x+(w/plates)*i;
    cx.beginPath();
    cx.moveTo(X(px),Y(y+11));
    cx.lineTo(X(px),Y(y+h-11));
    cx.stroke();
  }
  cx.strokeStyle='rgba(129,140,248,0.35)';
  cx.lineWidth=D(0.8);
  cx.beginPath();
  cx.moveTo(X(x+5),Y(y+h/2));
  cx.lineTo(X(x+w-5),Y(y+h/2));
  cx.stroke();
  // ports at 4 corners
  [[x,y+14],[x,y+h-14],[x+w,y+14],[x+w,y+h-14]].forEach(function(pt){
    cx.beginPath();
    cx.arc(X(pt[0]),Y(pt[1]),D(4),0,Math.PI*2);
    cx.fillStyle='#0a0f18';
    cx.fill();
    cx.strokeStyle=C.plate;
    cx.lineWidth=D(1.4);
    cx.stroke();
  });
  t('PLATE HX',x+w/2,y-9,C.plate,8,'700');
  t('HX',x+w/2,y+h/2-8,'#c7d2fe',9,'700');
  t('water⇄glycol',x+w/2,y+h/2+8,'#5b6db8',6.5,'600');
  cx.restore();
}

// ── V1 valve (3-way, charge/discharge/standby) ────────────────
function drawV1(vcx2,vcy,mode,alpha){
  var col=mode==='charge'?C.chg:mode==='discharge'?C.warm:'#475569';
  if(mode!=='standby') glow(vcx2,vcy,28,mode==='charge'?'#3b82f6':'#f59e0b',alpha*0.22);
  actuator(vcx2,vcy-18,col);
  cx.save();
  cx.globalAlpha=0.6+alpha*0.4;
  cx.fillStyle=col;
  cx.beginPath();
  cx.moveTo(X(vcx2-14),Y(vcy));
  cx.lineTo(X(vcx2),Y(vcy-10));
  cx.lineTo(X(vcx2),Y(vcy+10));
  cx.closePath();
  cx.fill();
  cx.beginPath();
  cx.moveTo(X(vcx2+14),Y(vcy));
  cx.lineTo(X(vcx2),Y(vcy-10));
  cx.lineTo(X(vcx2),Y(vcy+10));
  cx.closePath();
  cx.fill();
  cx.strokeStyle=col;
  cx.lineWidth=D(2);
  cx.setLineDash([]);
  cx.beginPath();
  cx.moveTo(X(vcx2),Y(vcy-10));
  cx.lineTo(X(vcx2),Y(vcy-18));
  cx.stroke();
  cx.beginPath();
  cx.arc(X(vcx2),Y(vcy),D(18),0,Math.PI*2);
  cx.strokeStyle=col;
  cx.lineWidth=D(1);
  cx.stroke();
  cx.beginPath();
  cx.arc(X(vcx2),Y(vcy),D(3.5),0,Math.PI*2);
  cx.fillStyle='#0a0f18';
  cx.fill();
  cx.strokeStyle=col;
  cx.lineWidth=D(1);
  cx.stroke();
  cx.restore();
  t('V1',vcx2,vcy,'#e2e8f0',7,'700');
  var ml=mode==='charge'?'CHARGE':mode==='discharge'?'DISCH':'STBY';
  t(ml,vcx2,vcy+27,col,7,'700');
  t('FV-101',vcx2,vcy+36,'#2a3d5c',5.5,'700');
}

// ── V2 valve (3-way mixing) ───────────────────────────────────
function drawV2(vcx2,vcy,alpha,mixPct){
  var col=alpha>0.3?'#a78bfa':'#475569';
  if(alpha>0.3) glow(vcx2,vcy,26,'#8b5cf6',alpha*0.22);
  actuator(vcx2,vcy-18,col);
  cx.save();
  cx.globalAlpha=0.6+alpha*0.4;
  cx.fillStyle=alpha>0.3?C.cold:col;
  cx.beginPath();
  cx.moveTo(X(vcx2+14),Y(vcy));
  cx.lineTo(X(vcx2+2),Y(vcy-9));
  cx.lineTo(X(vcx2+2),Y(vcy+9));
  cx.closePath();
  cx.fill();
  cx.fillStyle=alpha>0.3?C.warm:col;
  cx.beginPath();
  cx.moveTo(X(vcx2),Y(vcy+14));
  cx.lineTo(X(vcx2-7),Y(vcy+2));
  cx.lineTo(X(vcx2+7),Y(vcy+2));
  cx.closePath();
  cx.fill();
  cx.fillStyle=alpha>0.3?C.mix:col;
  cx.beginPath();
  cx.moveTo(X(vcx2-14),Y(vcy));
  cx.lineTo(X(vcx2-2),Y(vcy-9));
  cx.lineTo(X(vcx2-2),Y(vcy+9));
  cx.closePath();
  cx.fill();
  cx.beginPath();
  cx.arc(X(vcx2),Y(vcy),D(18),0,Math.PI*2);
  cx.strokeStyle=col;
  cx.lineWidth=D(1);
  cx.stroke();
  cx.beginPath();
  cx.arc(X(vcx2),Y(vcy),D(3.5),0,Math.PI*2);
  cx.fillStyle='#0a0f18';
  cx.fill();
  cx.strokeStyle=col;
  cx.lineWidth=D(1);
  cx.stroke();
  cx.restore();
  t('V2',vcx2,vcy,'#e2e8f0',7,'700');
  t('MIX',vcx2,vcy+27,col,7,'700');
  t('FV-102',vcx2,vcy+36,'#2a3d5c',5.5,'700');
}

// ── meter arc gauge ───────────────────────────────────────────
function drawMeterArc(x,y,r,val,mn,mx,tgt,cap,label){
  var a0=-148, a1=148;
  function ra(a){return (a-90)*Math.PI/180;}
  var fracVal=Math.min(1,Math.max(0,(val-mn)/(mx-mn)));
  var va=a0+(fracVal)*(a1-a0);
  var col=val>=cap-0.5?C.ret:val>=tgt?C.warm:C.cold;
  cx.save();
  cx.strokeStyle='#0d1a2a';
  cx.lineWidth=D(9);
  cx.lineCap='round';
  cx.setLineDash([]);
  cx.beginPath();
  cx.arc(X(x),Y(y),D(r),ra(a0),ra(a1));
  cx.stroke();
  cx.strokeStyle=col;
  cx.beginPath();
  cx.arc(X(x),Y(y),D(r),ra(a0),ra(va));
  cx.stroke();
  var ta=a0+((tgt-mn)/(mx-mn))*(a1-a0);
  var tick_x=x+r*Math.cos((ta-90)*Math.PI/180);
  var tick_y=y+r*Math.sin((ta-90)*Math.PI/180);
  cx.strokeStyle=C.warm;
  cx.lineWidth=D(1.5);
  cx.beginPath();
  cx.moveTo(X(tick_x-3),Y(tick_y-3));
  cx.lineTo(X(tick_x+3),Y(tick_y+3));
  cx.stroke();
  cx.restore();
  tm(val.toFixed(1),x,y,col,20,'700');
  tm('MW',x+14,y+3,col,7,'700','left');
  t(label,x,y+18,'#2a3d5c',6.5,'600');
}

// ── CRAH wavy coil draw ───────────────────────────────────────
function drawCRAH(dcX,dcY,dcW,dcH,supCol){
  // 3 wavy coil rows
  var coilRows=3;
  var coilStartY=dcY+32;
  var coilSpacing=(dcH-55)/coilRows;
  cx.save();
  cx.strokeStyle=supCol;
  cx.lineWidth=D(1.5);
  cx.setLineDash([]);
  for(var ci=0;ci<coilRows;ci++){
    var cy2=coilStartY+ci*coilSpacing+coilSpacing/2;
    cx.beginPath();
    var steps=60;
    for(var si=0;si<=steps;si++){
      var px=dcX+6+(dcW-12)*si/steps;
      var py=cy2+2.5*Math.sin(si/steps*Math.PI*5);
      if(si===0) cx.moveTo(X(px),Y(py));
      else cx.lineTo(X(px),Y(py));
    }
    cx.stroke();
  }
  // 3 airflow arrows
  var arrowSpacing=(dcW-20)/3;
  for(var ai=0;ai<3;ai++){
    var ax=dcX+10+ai*arrowSpacing+arrowSpacing/2;
    var ay=dcY+dcH-14;
    cx.fillStyle='#475569';
    cx.beginPath();
    cx.moveTo(X(ax),Y(ay+5));
    cx.lineTo(X(ax-4),Y(ay-1));
    cx.lineTo(X(ax-1.5),Y(ay-1));
    cx.lineTo(X(ax-1.5),Y(ay-7));
    cx.lineTo(X(ax+1.5),Y(ay-7));
    cx.lineTo(X(ax+1.5),Y(ay-1));
    cx.lineTo(X(ax+4),Y(ay-1));
    cx.closePath();
    cx.fill();
  }
  cx.restore();
}

// ── DLC (CDU + cold plates) draw ─────────────────────────────
function drawDLC(dcX,dcY,dcW,dcH){
  // CDU sub-box (left 40%)
  var cduW=dcW*0.38;
  var cduH=dcH-36;
  var cduX=dcX+4;
  var cduY=dcY+28;
  rr(cduX,cduY,cduW,cduH,3,'rgba(30,58,138,0.25)','#3b82f6',0.9);
  t('CDU',cduX+cduW/2,cduY+cduH/2,'#93c5fd',8,'700');
  // Cold-plate server bars (right 55%)
  var cpStartX=dcX+cduW+10;
  var cpW=dcW-cduW-18;
  var cpH=9;
  var cpCount=5;
  var cpSpacing=(cduH-8)/cpCount;
  cx.save();
  for(var cpi=0;cpi<cpCount;cpi++){
    var cpY2=cduY+4+cpi*cpSpacing;
    var cpGrad=cx.createLinearGradient(X(cpStartX),Y(cpY2),X(cpStartX+cpW),Y(cpY2));
    cpGrad.addColorStop(0,'rgba(56,189,248,0.55)');
    cpGrad.addColorStop(1,'rgba(248,113,113,0.55)');
    cx.fillStyle=cpGrad;
    cx.fillRect(X(cpStartX),Y(cpY2),D(cpW),D(cpH));
    cx.strokeStyle='rgba(100,116,139,0.4)';
    cx.lineWidth=D(0.5);
    cx.setLineDash([]);
    cx.strokeRect(X(cpStartX),Y(cpY2),D(cpW),D(cpH));
  }
  cx.restore();
  // secondary coolant loop connecting CDU to cold plates
  var loopY=cduY+cduH+5;
  solidLine([[cduX+cduW/2,cduY+cduH],[cduX+cduW/2,loopY],[cpStartX+cpW/2,loopY],[cpStartX+cpW/2,cduY+4]],'rgba(56,189,248,0.4)',0.8);
}

// ── main draw function ────────────────────────────────────────
function drawAll(h,st,fW,fG,fC){
  // background
  cx.fillStyle='#0d1117';
  cx.fillRect(0,0,cv.width,cv.height);

  // ── COMPONENT POSITIONS ──────────────────────────────────────
  // Main Meter: top-center
  var meterX=360, meterY=8, meterW=200, meterH=72;
  // Chiller Array: left zone upper
  var chillerX=18, chillerY=100, chillerW=160, chillerH=88;
  // Data Center: left zone lower
  var dcX=18, dcY=320, dcW=160, dcH=100;
  // Nostromo Chiller: right zone upper
  var nchX=542, nchY=100, nchW=160, nchH=80;
  // IceBricks TES: far right, tall tank
  var icesX=700, icesY=108, icesW=200, icesH=400;
  // Plate HX: interface area
  var hxX=400, hxY=220, hxW=110, hxH=88;
  // Valves
  var v1X=570, v1Y=310;
  var v2X=430, v2Y=270;

  // ── ZONE BACKGROUNDS ─────────────────────────────────────────
  // Interface / neutral zone (drawn first so zones paint over edges)
  rr(390,90,138,440,8,'rgba(148,163,184,0.025)','rgba(148,163,184,0.10)',0.8);

  // Data Centre zone (left)
  rr(8,90,380,440,10,'rgba(30,58,138,0.05)','rgba(59,130,246,0.22)',1.2);
  t('◆  DATA CENTRE',198,103,'rgba(96,165,250,0.65)',9,'700');

  // Nostromo IceBrick zone (right)
  rr(530,90,382,440,10,'rgba(5,150,105,0.05)','rgba(52,211,153,0.2)',1.2);
  t('◆  NOSTROMO ICEBRICK SYSTEM',721,103,'rgba(52,211,153,0.65)',9,'700');

  // ── MAIN METER BOX (top center) ──────────────────────────────
  rr(meterX,meterY,meterW,meterH,6,'#060c18','#1d4ed8',1.6);
  t('MAIN METER',meterX+meterW/2,meterY+11,'#93c5fd',11,'700');
  t('SITE POWER · 32 MW CAP',meterX+meterW/2,meterY+23,'#1e3a5f',7,'600');
  // Meter arc gauge (compact, fits in box)
  drawMeterArc(meterX+meterW/2,meterY+50,22,st.meter,0,CAP,31.5,CAP,'METER MW');
  // freed caption
  if(st.freed>0.5){
    t('+'+st.freed.toFixed(1)+' MW freed',meterX+meterW/2,meterY+meterH-7,C.cold,7,'700');
  }

  // ── ELECTRICAL LINES FROM METER ──────────────────────────────
  // Meter bottom-left corner → left zone (feeds chiller + DC)
  var mBotX=meterX+meterW/2;
  var mBotY=meterY+meterH;
  // Elbow left toward DC zone
  cx.save();
  cx.strokeStyle='#fbbf24';
  cx.lineWidth=D(2);
  cx.globalAlpha=0.55;
  cx.setLineDash([D(5),D(3)]);
  cx.beginPath();
  cx.moveTo(X(mBotX),Y(mBotY));
  cx.lineTo(X(mBotX-50),Y(mBotY+10));
  cx.lineTo(X(98),Y(mBotY+10));
  cx.lineTo(X(98),Y(chillerY));
  cx.stroke();
  cx.restore();
  t('⚡',mBotX-25,mBotY+6,'#fbbf24',8,'700');

  // Elbow right toward Nostromo zone (charge-only)
  cx.save();
  cx.strokeStyle=C.chg;
  cx.lineWidth=D(2.2);
  cx.globalAlpha=st.charging?0.88:0.12;
  cx.setLineDash([D(6),D(4)]);
  cx.lineDashOffset=-(fC*0.4);
  cx.beginPath();
  cx.moveTo(X(mBotX),Y(mBotY));
  cx.lineTo(X(mBotX+50),Y(mBotY+10));
  cx.lineTo(X(nchX+nchW/2),Y(mBotY+10));
  cx.lineTo(X(nchX+nchW/2),Y(nchY));
  cx.stroke();
  cx.restore();
  if(st.charging) t('⚡',mBotX+30,mBotY+5,C.chg,8,'700');

  // ── PIPE ROUTING ─────────────────────────────────────────────
  var aW=0.85;
  var aD=st.discharging?0.9:0.08;
  var aC=st.charging?0.9:0.08;

  // Supply (chiller outlet → down left side → DC supply port)
  // Chiller bottom-left → runs down → into DC top-left
  var chBotX=chillerX+20;
  var chBotY=chillerY+chillerH;
  var dcTopX=dcX+20;
  var dcTopY=dcY;
  pipe([[chBotX,chBotY],[chBotX,dcTopY-14],[dcTopX,dcTopY-14],[dcTopX,dcTopY]],C.sup,3.5,fW,aW);
  arrow(chBotX,(chBotY+dcTopY)/2,Math.PI/2,C.sup,4.5,aW);

  // Return (DC right → runs up → chiller return top-right)
  var dcRightX=dcX+dcW-20;
  var dcRightY=dcY;
  var chRightX=chillerX+chillerW-20;
  var chRightY=chillerY+chillerH;
  pipe([[dcRightX,dcRightY],[dcRightX,chRightY+20],[chRightX,chRightY+20],[chRightX,chRightY]],C.ret,3.5,fW*0.9,aW);
  arrow(dcRightX,(dcRightY+chRightY)/2,3*Math.PI/2,C.ret,4.5,aW);

  // Chiller supply runs right to HX top-left port
  var chOutX=chillerX+chillerW;
  var chOutY=chillerY+24;
  pipe([[chOutX,chOutY],[hxX,chOutY],[hxX,hxY+14]],C.sup,3.5,fW,aW);
  arrow((chOutX+hxX)/2,chOutY,0,C.sup,4.5,aW);

  // HX water out bottom-left → return to chiller bottom
  pipe([[hxX,hxY+hxH-14],[hxX,chRightY+20]],C.ret,3.5,fW*0.9,aW*0.7);

  // Glycol discharge: IceBricks cold port (left side) → V2 → HX right ports
  // IceBricks left port at (icesX, icesY + icesH*0.35) = (700,248)
  var icesPortColdY=icesY+icesH*0.35;
  var icesPortWarmY=icesY+icesH*0.65;
  // Cold glycol: IceBricks → V1 → route up to V2 → HX bottom-right
  pipe([[icesX,icesPortColdY],[v1X,icesPortColdY],[v1X,v1Y+18]],C.cold,3.5,fG,aD);
  arrow((icesX+v1X)/2,icesPortColdY,Math.PI,C.cold,4.5,aD);
  // V1 top → runs left to V2
  pipe([[v1X,v1Y-18],[v1X,v2Y],[v2X+18,v2Y]],C.cold,3.5,fG,aD);
  arrow(v1X,(v1Y-18+v2Y)/2,3*Math.PI/2,C.cold,4.5,aD);
  // V2 left → HX right bottom port
  pipe([[v2X-18,v2Y],[hxX+hxW,v2Y],[hxX+hxW,hxY+hxH-14]],C.mix,3.5,fG,aD);
  arrow((v2X-18+hxX+hxW)/2,v2Y,Math.PI,C.mix,4.5,aD);

  // HX warm glycol out top-right → runs down right side → back to IceBricks warm port
  pipe([[hxX+hxW,hxY+14],[hxX+hxW,icesPortWarmY-10],[icesX,icesPortWarmY]],C.warm,3.5,fG,aD*0.8);
  arrow(hxX+hxW,(hxY+14+icesPortWarmY)/2,Math.PI/2,C.warm,4.5,aD*0.8);

  // Charge loop: N.Chiller bottom → V1 bottom → IceBricks cold port
  var nchBotX=nchX+nchW/2;
  var nchBotY=nchY+nchH;
  pipe([[nchBotX,nchBotY],[nchBotX,v1Y],[v1X+18,v1Y]],C.chg,3.5,fC,aC);
  arrow(nchBotX,(nchBotY+v1Y)/2,Math.PI/2,C.chg,4.5,aC);
  // Warm return from IceBricks warm port → N.Chiller
  pipe([[icesX,icesPortWarmY],[nchX+nchW,icesPortWarmY],[nchX+nchW,nchBotY-10],[nchBotX,nchBotY-10],[nchBotX,nchBotY]],C.warm,3,fC*0.85,aC*0.7);

  // ── ISA INSTRUMENTS ──────────────────────────────────────────
  // Level 3 — subdued
  cx.globalAlpha=0.5;
  isa(chBotX-14,chBotY+22,'FT','101',C.sup,7);
  isa(dcRightX+14,dcRightY-22,'FT','102',C.ret,7);
  isa(hxX-14,hxY+hxH/2,'TT','201',C.cold,7);
  isa(hxX+hxW+14,hxY+hxH/2,'PT','202',C.plate,7);
  isa(v1X+24,v1Y-10,'TT','301',C.warm,7);
  cx.globalAlpha=1;

  // ── PUMPS ────────────────────────────────────────────────────
  pump(chBotX,chBotY+8,9,'P1','','270');
  pump(dcRightX,dcY-8,9,'P2','','90');
  pump(nchBotX,nchBotY+8,9,'P4','','270');

  // ── HX ───────────────────────────────────────────────────────
  hxRect(hxX,hxY,hxW,hxH,1);

  // ── VALVES ───────────────────────────────────────────────────
  var v1Mode=st.charging?'charge':st.discharging?'discharge':'standby';
  drawV1(v1X,v1Y,v1Mode,1);
  drawV2(v2X,v2Y,st.discharging?0.9:0.3,0.5);

  // ── CHILLER ARRAY (left zone, upper) ─────────────────────────
  rr(chillerX,chillerY,chillerW,chillerH,6,'#060c18','#334155',1.2);
  t('CHILLER ARRAY',chillerX+chillerW/2,chillerY+9,'#94a3b8',10,'700');
  t('12 UNITS · N+1',chillerX+chillerW/2,chillerY+20,'#334155',7,'600');
  var totalUnits=12;
  var onUnits=st.nRun;
  var relUnits=st.nRel;
  var cols=6, rows=2;
  var uW=(chillerW-12)/(cols+0.2), uH=(chillerH-32)/rows;
  for(var row=0;row<rows;row++){
    for(var col=0;col<cols;col++){
      var ui=row*cols+col;
      var ux=chillerX+6+col*(uW+2);
      var uy=chillerY+28+row*(uH+3);
      var isOn=ui<onUnits;
      var isRel=ui>=onUnits&&ui<onUnits+relUnits;
      var bg=isRel?'rgba(52,211,153,0.15)':isOn?'rgba(248,113,113,0.15)':'#0a1018';
      var bdr=isRel?C.cold:isOn?C.ret:'#1e2d3d';
      rr(ux,uy,uW,uH,2,bg,bdr,0.8);
      cx.save();
      cx.beginPath();
      cx.arc(X(ux+uW/2),Y(uy+uH/2),D(uH/2-2),0,Math.PI*2);
      cx.strokeStyle=isRel?'rgba(52,211,153,0.5)':isOn?'rgba(248,113,113,0.5)':'#1e2d3d';
      cx.lineWidth=D(0.8);
      cx.setLineDash([]);
      cx.stroke();
      cx.restore();
    }
  }
  t('60°F SUPPLY',chillerX+chillerW/2,chillerY+chillerH-8,'#38bdf8',7,'700');

  // ── DATA CENTER (left zone, lower) ───────────────────────────
  var dcLabel=coolingMode==='crah'?'CRAH UNITS · IT HALL A':'CDU + COLD PLATES · IT HALL A';
  rr(dcX,dcY,dcW,dcH,6,'#060c18','#334155',1.2);
  t(dcLabel,dcX+dcW/2,dcY+10,'#94a3b8',9,'700');

  if(coolingMode==='crah'){
    drawCRAH(dcX,dcY,dcW,dcH,C.sup);
    t('60°F IN / 70°F OUT',dcX+dcW/2,dcY+dcH-8,'#475569',6.5,'600');
  } else {
    drawDLC(dcX,dcY,dcW,dcH);
    t('CDU SECONDARY LOOP',dcX+dcW/2,dcY+dcH-8,'#475569',6.5,'600');
  }

  // ── NOSTROMO GLYCOL CHILLER (right zone, upper) ───────────────
  if(st.charging) glow(nchX+nchW/2,nchY+nchH/2,55,C.chg,0.16);
  rr(nchX,nchY,nchW,nchH,6,'#060c18',st.charging?C.chg:'#1e3050',st.charging?1.8:1.2);
  t('NOSTROMO CHILLER',nchX+nchW/2,nchY+13,'#a5b4fc',11,'700');
  t(st.charging?'● CHARGING':'○ IDLE',nchX+nchW/2,nchY+26,st.charging?C.chg:'#2a3d5c',9,'700');
  // fan
  var fanCx=nchX+nchW/2, fanCy=nchY+55, fanR=18;
  cx.beginPath(); cx.arc(X(fanCx),Y(fanCy),D(fanR),0,Math.PI*2);
  cx.fillStyle='#060a10'; cx.fill();
  cx.strokeStyle=st.charging?C.chg:'#1e3050'; cx.lineWidth=D(1.2); cx.setLineDash([]); cx.stroke();
  cx.save(); cx.translate(X(fanCx),Y(fanCy));
  if(st.charging) cx.rotate(fC*0.08);
  for(var bi=0;bi<4;bi++){
    cx.rotate(Math.PI/2);
    cx.fillStyle=st.charging?colA(C.chg,0.65):'rgba(30,48,80,0.8)';
    cx.beginPath(); cx.moveTo(0,0); cx.lineTo(D(fanR-3),0); cx.lineTo(D(fanR-3),D(-5)); cx.lineTo(D(3),D(-2)); cx.closePath(); cx.fill();
  }
  cx.restore();
  // chiller MW label (level 2)
  if(st.charging){
    tm(st.chargeKW.toFixed(1)+' MW',nchX+nchW/2,nchY+nchH-10,C.chg,9,'700');
  }

  // ── ICEBRICKS TES (far right, tall) ──────────────────────────
  var shimmer=0.26+st.soc*0.16+0.06*Math.sin(Date.now()/700);
  var tesGlowCol=st.discharging?C.cold:st.charging?C.chg:'#334155';
  if(st.discharging||st.charging) glow(icesX+icesW/2,icesY+icesH/2,icesW*0.7,tesGlowCol,0.14);
  rr(icesX,icesY,icesW,icesH,6,'#060c18',tesGlowCol,1.4);
  t('ICEBRICKS TES',icesX+icesW/2,icesY+12,'#5eead4',11,'700');
  t('15 TRh CAPACITY',icesX+icesW/2,icesY+24,'#134e4a',7,'600');

  // level fill
  var fillH=st.soc*(icesH-38);
  var fillY=icesY+icesH-6-fillH;
  var fillGrad=cx.createLinearGradient(X(icesX+8),Y(fillY),X(icesX+8),Y(fillY+fillH));
  fillGrad.addColorStop(0,'rgba(34,211,238,'+shimmer+')');
  fillGrad.addColorStop(1,'rgba(52,211,153,'+(shimmer*0.6)+')');
  cx.save();
  cx.globalAlpha=1;
  cx.beginPath();
  cx.rect(X(icesX+4),Y(icesY+32),D(icesW-8),D(icesH-38));
  cx.clip();
  cx.fillStyle=fillGrad;
  cx.fillRect(X(icesX+4),Y(fillY),D(icesW-8),D(fillH));
  cx.strokeStyle='rgba(13,26,42,0.4)';
  cx.lineWidth=D(0.8);
  cx.setLineDash([]);
  for(var gx2=icesX+4;gx2<icesX+icesW-4;gx2+=28){
    cx.beginPath();
    cx.moveTo(X(gx2),Y(icesY+32));
    cx.lineTo(X(gx2),Y(icesY+icesH-6));
    cx.stroke();
  }
  for(var gy2=icesY+32;gy2<icesY+icesH-6;gy2+=28){
    cx.beginPath();
    cx.moveTo(X(icesX+4),Y(gy2));
    cx.lineTo(X(icesX+icesW-4),Y(gy2));
    cx.stroke();
  }
  if(fillH>5){
    cx.strokeStyle='rgba(167,243,208,0.7)';
    cx.lineWidth=D(1.5);
    cx.beginPath();
    cx.moveTo(X(icesX+4),Y(fillY));
    cx.lineTo(X(icesX+icesW-4),Y(fillY));
    cx.stroke();
  }
  cx.restore();

  // ── LEVEL 1: Phase status banner + SOC (most prominent) ──────
  // Phase banner centered above IceBricks fill area, inside Nostromo zone
  var phaseText=st.charging?'CHARGING':st.discharging?'DISCHARGING':(h>=8&&h<12?'STANDBY':'RESETTING');
  var phaseCol=st.charging?'#22d3ee':st.discharging?'#34d399':(h>=8&&h<12?'#334155':'#f97316');
  // banner background
  rr(icesX+4,icesY+36,icesW-8,24,4,colA(phaseCol,0.08),phaseCol,0.6);
  t(phaseText,icesX+icesW/2,icesY+48,phaseCol,12,'800');

  // SOC % — very large, centered on fill area
  var socPct2=Math.round(st.soc*100);
  tm(socPct2+'%',icesX+icesW/2,icesY+icesH/2,'#ffffff',26,'700');
  t('STATE OF CHARGE',icesX+icesW/2,icesY+icesH/2+18,'#94a3b8',7,'600');

  // port indicators
  [[icesX,icesPortColdY],[icesX,icesPortWarmY],
   [icesX+icesW,icesPortColdY],[icesX+icesW,icesPortWarmY]].forEach(function(pt,pi){
    cx.beginPath();
    cx.arc(X(pt[0]),Y(pt[1]),D(4),0,Math.PI*2);
    cx.fillStyle='#0a0f18';
    cx.fill();
    cx.strokeStyle=pi<2?C.cold:C.warm;
    cx.lineWidth=D(1.2);
    cx.setLineDash([]);
    cx.stroke();
  });

  // state label at bottom
  t(phaseText,icesX+icesW/2,icesY+icesH-10,phaseCol,8,'700');

  // ── LEVEL 2: KPI panel — DC Live Status ──────────────────────
  // Positioned below meter, spanning center-to-center
  rr(200,8,155,72,6,'#060a14',C.sup,1.1);
  t('DC LIVE STATUS',277,20,C.sup,9,'700');
  var kpis=[
    {label:'IT LOAD',  val:itLoad.toFixed(1)+' MW', col:C.sup},
    {label:'CHILLER',  val:st.chEff.toFixed(1)+' MW',col:C.ret},
    {label:'PUE',      val:(1+st.chEff/itLoad).toFixed(2),col:'#a78bfa'},
    {label:'FREED',    val:st.freed.toFixed(1)+' MW',col:C.cold}
  ];
  kpis.forEach(function(kpi,i){
    var kx=204+i*37, ky=46;
    rr(kx,ky-9,33,28,3,'#0a0e18',kpi.col,0.6);
    t(kpi.label,kx+16.5,ky-2,'#2a3d5c',5.5,'700');
    tm(kpi.val,kx+16.5,ky+9,kpi.col,8,'700');
  });
  // Meter bar
  var bBar=204, yBar=69, wBar=148, hBar=6;
  cx.save();
  cx.beginPath(); cx.rect(X(bBar),Y(yBar),D(wBar),D(hBar)); cx.fillStyle='#0a0e18'; cx.fill();
  cx.fillStyle='rgba(56,189,248,0.38)';
  cx.fillRect(X(bBar),Y(yBar),D(wBar*(itLoad/CAP)),D(hBar));
  cx.fillStyle='rgba(248,113,113,0.38)';
  cx.fillRect(X(bBar+wBar*(itLoad/CAP)),Y(yBar),D(wBar*(st.chEff/CAP)),D(hBar));
  if(st.charging&&st.chargeKW>0){
    cx.fillStyle='rgba(96,165,250,0.55)';
    cx.fillRect(X(bBar+wBar*((itLoad+st.chEff)/CAP)),Y(yBar),D(wBar*(st.chargeKW/CAP)),D(hBar));
  }
  cx.strokeStyle='#ef4444'; cx.lineWidth=D(1); cx.setLineDash([]);
  cx.beginPath(); cx.moveTo(X(bBar+wBar),Y(yBar-1)); cx.lineTo(X(bBar+wBar),Y(yBar+hBar+1)); cx.stroke();
  cx.restore();
  t('cap 32',bBar+wBar+3,yBar+3,'#ef4444',6,'700','left');

  // TES relief (right side of meter bar, Nostromo side)
  rr(563,8,155,72,6,'#060a14',C.cold,1.1);
  t('TES RELIEF',640,20,C.cold,9,'700');
  var tesOff=st.off.toFixed(1)+' MW';
  tm(tesOff,640,44,st.discharging?C.cold:'#1e3050',18,'700');
  t(st.discharging?'ACTIVE':'IDLE',640,62,st.discharging?C.cold:'#2a3d5c',8,'700');

  // ── LEVEL 2: Temperature callouts on pipes ────────────────────
  t('45°F',chBotX-15,(chBotY+dcTopY)/2,C.sup,8,'700');
  t('70°F',dcRightX+15,(dcRightY+chRightY)/2,C.ret,8,'700');
  t('32°F',(icesX+v1X)/2+10,icesPortColdY-8,C.cold,8,'700');
  t('82°F',hxX+hxW+18,hxY+14,C.warm,8,'700');

  // ── LEVEL 3: Ambient temperature (subdued) ────────────────────
  cx.globalAlpha=0.5;
  t(Math.round(st.T)+'°F AMB',460,78,C.warm,7.5,'600');
  cx.globalAlpha=1;

  // ── FOOTER / COLOR KEY ─────────────────────────────────────────
  var fkeys=[
    {col:C.sup,label:'WATER SUPPLY'},
    {col:C.ret,label:'WATER RETURN'},
    {col:C.cold,label:'COLD GLYCOL'},
    {col:C.warm,label:'WARM GLYCOL'},
    {col:C.chg,label:'CHARGE LOOP'},
    {col:'#fbbf24',label:'GRID POWER'},
    {col:C.plate,label:'HX / PLATE'}
  ];
  var fkStartX=12, fkY=543, fkSpacing=128;
  fkeys.forEach(function(fk,fi){
    var kx=fkStartX+fi*fkSpacing;
    cx.save();
    cx.fillStyle=fk.col;
    cx.fillRect(X(kx),Y(fkY-2),D(18),D(4));
    cx.restore();
    t(fk.label,kx+22,fkY,fk.col,7.5,'600','left');
  });
}

// ── HUD UPDATE ────────────────────────────────────────────────
function updateHUD(h,st){
  var hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  document.getElementById('clock').textContent=
    String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  var scrub2=document.getElementById('scrub');
  scrub2.value=Math.round(h/24*9999);

  var badge=document.getElementById('badge');
  var phases={
    charge:{text:'CHARGING',bg:'rgba(6,182,212,.15)',border:'#22d3ee',col:'#22d3ee'},
    discharge:{text:'DISCHARGING',bg:'rgba(20,184,166,.15)',border:'#14B8A6',col:'#14B8A6'},
    standby:{text:'STANDBY',bg:'rgba(255,255,255,.03)',border:'#14213a',col:'#14213a'},
    recover:{text:'RESETTING',bg:'rgba(249,115,22,.12)',border:'#f97316',col:'#f97316'}
  };
  var p=phases[st.phase]||phases.standby;
  badge.textContent=p.text;
  badge.style.background=p.bg;
  badge.style.borderColor=p.border;
  badge.style.color=p.col;
}

// ── ANIMATION LOOP ────────────────────────────────────────────
var fW=0, fG=0, fC=0;
var progress=0, playing=false, speed=2, last2=0;

function loop(now){
  requestAnimationFrame(loop);
  if(playing){
    var dt=(now-last2)/1000;
    last2=now;
    progress+=dt*speed*0.022;
    if(progress>=1) progress-=1;
  } else {
    last2=now;
  }
  fW+=0.38; fG+=0.35; fC+=0.32;

  var h=progress*24;
  var st=state(h);
  drawAll(h,st,fW,fG,fC);
  updateHUD(h,st);
}
requestAnimationFrame(loop);

// ── CONTROLS ──────────────────────────────────────────────────
var playbtn=document.getElementById('playbtn');
playbtn.addEventListener('click',function(){
  playing=!playing;
  playbtn.textContent=playing?'⏸ PAUSE':'▶ PLAY';
  if(playing) last2=performance.now();
});

function setSpeed(s){
  speed=s;
  ['s1btn','s2btn','s4btn'].forEach(function(id){
    var el=document.getElementById(id);
    el.style.color='#5b7bb8';
    el.style.borderColor='#1e3050';
  });
  var active=document.getElementById('s'+s+'btn');
  active.style.color='#a78bfa';
  active.style.borderColor='#3b2a6a';
}
document.getElementById('s1btn').addEventListener('click',function(){setSpeed(1);});
document.getElementById('s2btn').addEventListener('click',function(){setSpeed(2);});
document.getElementById('s4btn').addEventListener('click',function(){setSpeed(4);});

// scrub
var scrubEl=document.getElementById('scrub');
scrubEl.addEventListener('input',function(){
  progress=parseInt(this.value)/9999;
  if(!playing) last2=performance.now();
});

// sliders
var siEl=document.getElementById('si');
var saEl=document.getElementById('sa');
siEl.addEventListener('input',function(){
  itLoad=parseFloat(this.value);
  document.getElementById('li').textContent=itLoad.toFixed(1)+' MW';
});
saEl.addEventListener('input',function(){
  ambientPeak=parseInt(this.value);
  document.getElementById('la').textContent=ambientPeak+'°F';
});

// start playing after a brief pause
setTimeout(function(){
  playing=true;
  last2=performance.now();
  playbtn.textContent='⏸ PAUSE';
},600);

})();
</script>
