<script>
(function(){
'use strict';

// ── constants ────────────────────────────────────────────────
const CAP=32, IT_DEFAULT=20;
var itLoad=IT_DEFAULT;
var ambientPeak=88;

// virtual coordinate system
const VW=920, VH=548;

var cv=document.getElementById('cv');
var cx=cv.getContext('2d');
var gcv=document.getElementById('gcv');
var gx=gcv.getContext('2d');
function resizeGraph(){gcv.width=gcv.offsetWidth;gcv.height=gcv.offsetHeight;}
resizeGraph();
window.addEventListener('resize',resizeGraph);

// ── cooling mode toggle ───────────────────────────────────────
var coolingMode='crah'; // 'crah' or 'dlc'
document.getElementById('coolbtn').addEventListener('click',function(){
  coolingMode=coolingMode==='crah'?'dlc':'crah';
  this.textContent=coolingMode.toUpperCase();
  this.style.color=coolingMode==='crah'?'#34d399':'#a78bfa';
  this.style.borderColor=coolingMode==='crah'?'#065f46':'#3b2a6a';
});

// ── resize ───────────────────────────────────────────────────
function resize(){
  var ctr=document.getElementById('ctr');
  cv.width=ctr.clientWidth;
  cv.height=ctr.clientHeight;
}
resize();
window.addEventListener('resize',resize);

function sc(){
  var s=Math.min(cv.width/VW,cv.height/VH);
  return {s:s,ox:(cv.width-VW*s)/2,oy:(cv.height-VH*s)/2};
}
function X(x){var r=sc();return r.ox+x*r.s;}
function Y(y){var r=sc();return r.oy+y*r.s;}
function D(v){return sc().s*v;}

// ── simulation math ──────────────────────────────────────────
function temp(h){
  var hh=h;
  if(hh<5) hh+=24;
  var x=(hh-5)/24;
  var peakx=0.458, w=0.62;
  var base=64, amp=ambientPeak-64;
  var v=Math.cos((x-peakx)/w*Math.PI); v=(v+1)/2;
  return base+amp*Math.pow(v,1.1);
}
function soc(h){
  if(h>=22) return Math.max(0,Math.min(1,0.10+(h-22)/10*0.90));
  if(h<8)   return Math.max(0,Math.min(1,0.10+(h+2)/10*0.90));
  if(h<12)  return 1;
  if(h<20)  return Math.max(0.12,Math.min(1,1-(h-12)/8*0.88));
  return 0.12;
}
function isCharge(h){return h>=22||h<8;}
function isDischarge(h){return h>=12&&h<20;}
function state(h){
  var T=temp(h);
  var coolFrac=Math.max(0,Math.min(1,(T-60)/(98-60)));
  var chRaw=4+8*coolFrac;
  var s=soc(h), charging=isCharge(h), discharging=isDischarge(h);
  var pacing=Math.min(1,s/0.15);
  var off=discharging?Math.min(chRaw-2.5,7)*pacing:0;
  var chEff=Math.max(2,chRaw-off);
  var chargeKW=0;
  if(charging){var headroom=CAP-0.6-(itLoad+chRaw);chargeKW=Math.max(0,Math.min(3.6,headroom));}
  var meter=itLoad+chEff+chargeKW;
  var freed=Math.max(0,CAP-meter);
  var nRun=Math.max(2,Math.round(chEff/12*8));
  var nRel=discharging?Math.round(off/12*8):0;
  var phase=charging?'charge':discharging?'discharge':(h>=8&&h<12?'standby':'recover');
  return {h:h,T:T,coolFrac:coolFrac,soc:s,charging:charging,discharging:discharging,
    chRaw:chRaw,chEff:chEff,chargeKW:chargeKW,meter:meter,freed:freed,off:off,
    nRun:nRun,nRel:nRel,phase:phase,chillFrac:Math.min(1,chEff/12)};
}

// ── color palette ─────────────────────────────────────────────
var C={sup:'#38bdf8',pre:'#7dd3fc',ret:'#f87171',cold:'#34d399',mix:'#22d3ee',
       warm:'#fbbf24',chg:'#60a5fa',cmd:'#a78bfa',plate:'#a5b4fc'};

// ── draw utilities ────────────────────────────────────────────
function rr(x,y,w,h,r,fill,stroke,lw){
  cx.beginPath();
  cx.moveTo(X(x+r),Y(y));
  cx.lineTo(X(x+w-r),Y(y));
  cx.quadraticCurveTo(X(x+w),Y(y),X(x+w),Y(y+r));
  cx.lineTo(X(x+w),Y(y+h-r));
  cx.quadraticCurveTo(X(x+w),Y(y+h),X(x+w-r),Y(y+h));
  cx.lineTo(X(x+r),Y(y+h));
  cx.quadraticCurveTo(X(x),Y(y+h),X(x),Y(y+h-r));
  cx.lineTo(X(x),Y(y+r));
  cx.quadraticCurveTo(X(x),Y(y),X(x+r),Y(y));
  cx.closePath();
  if(fill){cx.fillStyle=fill;cx.fill();}
  if(stroke){cx.strokeStyle=stroke;cx.lineWidth=D(lw||1);cx.setLineDash([]);cx.stroke();}
}

function t(s,x,y,col,sz,w,a){
  cx.save();
  cx.fillStyle=col||'#fff';
  cx.font=(w||'400')+' '+D(sz||9)+'px "Outfit","Segoe UI",system-ui,sans-serif';
  cx.textAlign=a||'center';
  cx.textBaseline='middle';
  cx.fillText(s,X(x),Y(y));
  cx.restore();
}
function tm(s,x,y,col,sz,w,a){
  cx.save();
  cx.fillStyle=col||'#fff';
  cx.font=(w||'400')+' '+D(sz||9)+'px "JetBrains Mono","Courier New",monospace';
  cx.textAlign=a||'center';
  cx.textBaseline='middle';
  cx.fillText(s,X(x),Y(y));
  cx.restore();
}

function glow(x,y,r,col,a){
  cx.save();
  var ga=cx.createRadialGradient(X(x),Y(y),0,X(x),Y(y),D(r));
  ga.addColorStop(0,colA(col,a||0.3));
  ga.addColorStop(1,colA(col,0));
  cx.fillStyle=ga;
  cx.beginPath();
  cx.arc(X(x),Y(y),D(r),0,Math.PI*2);
  cx.fill();
  cx.restore();
}

function colA(hex,alpha){
  var r=parseInt(hex.slice(1,3),16),
      g=parseInt(hex.slice(3,5),16),
      b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

function lerpHex(c1,c2,t2){
  var r1=parseInt(c1.slice(1,3),16), g1=parseInt(c1.slice(3,5),16), b1=parseInt(c1.slice(5,7),16);
  var r2=parseInt(c2.slice(1,3),16), g2=parseInt(c2.slice(3,5),16), b2=parseInt(c2.slice(5,7),16);
  var r=Math.round(r1+(r2-r1)*t2), g=Math.round(g1+(g2-g1)*t2), b=Math.round(b1+(b2-b1)*t2);
  return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
}

function pipe(pts,col,lw,off,alpha){
  if(pts.length<2) return;
  cx.save();
  cx.globalAlpha=alpha||1;
  cx.strokeStyle=col;
  cx.lineWidth=D(lw||4);
  cx.lineCap='round';
  cx.lineJoin='round';
  cx.setLineDash([D(8),D(5)]);
  cx.lineDashOffset=-off;
  cx.beginPath();
  cx.moveTo(X(pts[0][0]),Y(pts[0][1]));
  for(var i=1;i<pts.length;i++) cx.lineTo(X(pts[i][0]),Y(pts[i][1]));
  cx.stroke();
  cx.restore();
}

function solidLine(pts,col,lw){
  if(pts.length<2) return;
  cx.save();
  cx.strokeStyle=col;
  cx.lineWidth=D(lw||1);
  cx.lineCap='round';
  cx.lineJoin='round';
  cx.setLineDash([]);
  cx.beginPath();
  cx.moveTo(X(pts[0][0]),Y(pts[0][1]));
  for(var i=1;i<pts.length;i++) cx.lineTo(X(pts[i][0]),Y(pts[i][1]));
  cx.stroke();
  cx.restore();
}

// ── pipe label (pill badge) ───────────────────────────────────
function pipeLabel(lbl,vx,vy,col,alpha){
  if((alpha||1)<0.25) return;
  cx.save();
  cx.globalAlpha=alpha||1;
  var fs=D(6.5);
  cx.font='700 '+fs+'px "JetBrains Mono","Courier New",monospace';
  cx.textAlign='center'; cx.textBaseline='middle';
  var tw=cx.measureText(lbl).width;
  var padX=D(4), padY=D(3.5);
  var px=X(vx), py=Y(vy);
  // pill background
  cx.beginPath();
  if(cx.roundRect){
    cx.roundRect(px-tw/2-padX, py-padY, tw+padX*2, padY*2, D(2));
  } else {
    cx.rect(px-tw/2-padX, py-padY, tw+padX*2, padY*2);
  }
  cx.fillStyle='rgba(8,12,20,0.85)';
  cx.fill();
  cx.strokeStyle=col; cx.lineWidth=0.8; cx.setLineDash([]); cx.stroke();
  cx.fillStyle=col;
  cx.fillText(lbl,px,py);
  cx.restore();
}

// ── flow dots traveling along a polyline ─────────────────────
function flowDots(pts,col,offset,alpha,nDots){
  if(alpha<0.3||pts.length<2) return;
  var segs=[];
  var total=0;
  for(var i=1;i<pts.length;i++){
    var dx=pts[i][0]-pts[i-1][0], dy=pts[i][1]-pts[i-1][1];
    var len=Math.sqrt(dx*dx+dy*dy);
    segs.push({x0:pts[i-1][0],y0:pts[i-1][1],x1:pts[i][0],y1:pts[i][1],len:len,cum:total});
    total+=len;
  }
  var n=nDots||4;
  for(var di=0;di<n;di++){
    var tPos=((offset*0.6+di*(total/n))%total+total)%total;
    for(var si=0;si<segs.length;si++){
      var seg=segs[si];
      if(tPos<=seg.cum+seg.len||si===segs.length-1){
        var frac=seg.len>0?(tPos-seg.cum)/seg.len:0;
        frac=Math.max(0,Math.min(1,frac));
        var dotX=seg.x0+frac*(seg.x1-seg.x0);
        var dotY=seg.y0+frac*(seg.y1-seg.y0);
        cx.save();
        cx.globalAlpha=alpha*0.75;
        cx.beginPath();
        cx.arc(X(dotX),Y(dotY),D(2),0,Math.PI*2);
        cx.fillStyle=col;
        cx.fill();
        cx.restore();
        break;
      }
    }
  }
}

function arrow(x,y,ang,col,sz,alpha){
  cx.save();
  cx.globalAlpha=alpha||1;
  cx.fillStyle=col;
  cx.translate(X(x),Y(y));
  cx.rotate(ang);
  var s=D(sz||5);
  cx.beginPath();
  cx.moveTo(s,0);
  cx.lineTo(-s,-s*0.6);
  cx.lineTo(-s,s*0.6);
  cx.closePath();
  cx.fill();
  cx.restore();
}

function pump(pcx2,pcy,pr,lbl,tag,dir){
  cx.save();
  cx.beginPath();
  cx.arc(X(pcx2),Y(pcy),D(pr),0,Math.PI*2);
  cx.fillStyle='#060a10';
  cx.fill();
  cx.strokeStyle='#38bdf8';
  cx.lineWidth=D(1.2);
  cx.setLineDash([]);
  cx.stroke();
  var ang=(dir||0)*Math.PI/180;
  cx.fillStyle='#38bdf8';
  cx.translate(X(pcx2),Y(pcy));
  cx.rotate(ang);
  var s=D(pr*0.55);
  cx.beginPath();
  cx.moveTo(s,0);
  cx.lineTo(-s,-s*0.65);
  cx.lineTo(-s*0.3,0);
  cx.lineTo(-s,s*0.65);
  cx.closePath();
  cx.fill();
  cx.restore();
  if(lbl) t(lbl,pcx2,pcy+pr+8,'#38bdf8',7,'700');
  if(tag) t(tag,pcx2,pcy+pr+16,'#2a3d5c',6,'700');
}

function isa(x,y,fn,loop,col,r){
  var rad=r||9;
  cx.beginPath();
  cx.arc(X(x),Y(y),D(rad),0,Math.PI*2);
  cx.fillStyle='#060a10';
  cx.fill();
  cx.strokeStyle=col||'#5b7bb8';
  cx.lineWidth=D(1);
  cx.setLineDash([]);
  cx.stroke();
  if(loop){
    cx.beginPath();
    cx.arc(X(x),Y(y),D(rad-2.5),0,Math.PI*2);
    cx.stroke();
  }
  t(fn||'',x,y-2,col||'#5b7bb8',6,'700');
  t(loop||'',x,y+3.5,col||'#5b7bb8',5,'400');
}

function actuator(x,y,col){
  cx.save();
  cx.fillStyle=col||'#475569';
  cx.strokeStyle=col||'#475569';
  cx.lineWidth=D(1);
  cx.setLineDash([]);
  cx.beginPath();
  cx.moveTo(X(x),Y(y+8));
  cx.lineTo(X(x),Y(y+2));
  cx.stroke();
  cx.beginPath();
  cx.rect(X(x-7),Y(y-8),D(14),D(10));
  cx.fillStyle='#060a10';
  cx.fill();
  cx.strokeStyle=col||'#475569';
  cx.stroke();
  cx.fillStyle=col||'#475569';
  cx.beginPath();
  cx.moveTo(X(x),Y(y+2));
  cx.lineTo(X(x-3),Y(y-2));
  cx.lineTo(X(x+3),Y(y-2));
  cx.closePath();
  cx.fill();
  cx.restore();
}

// ── plate heat exchanger ──────────────────────────────────────
function hxRect(x,y,w,h,alpha){
  cx.save();
  cx.globalAlpha=alpha||1;
  if(alpha>0.2) glow(x+w/2,y+h/2,w*1.1,C.plate,alpha*0.14);
  rr(x,y,w,h,2,'#070a14',C.plate,1.8);
  cx.fillStyle='rgba(129,140,248,0.10)';
  cx.fillRect(X(x+3),Y(y+3),D(w-6),D(6));
  cx.fillRect(X(x+3),Y(y+h-9),D(w-6),D(6));
  cx.setLineDash([]);
  var plates=10;
  for(var i=1;i<plates;i++){
    var px=x+(w/plates)*i;
    // alternating colors: even=water side (blue), odd=glycol side (teal)
    cx.strokeStyle=i%2===0?'rgba(56,189,248,0.4)':'rgba(52,211,153,0.4)';
    cx.lineWidth=D(0.9);
    cx.beginPath();
    cx.moveTo(X(px),Y(y+11));
    cx.lineTo(X(px),Y(y+h-11));
    cx.stroke();
  }
  cx.strokeStyle='rgba(129,140,248,0.35)';
  cx.lineWidth=D(0.8);
  cx.beginPath();
  cx.moveTo(X(x+5),Y(y+h/2));
  cx.lineTo(X(x+w-5),Y(y+h/2));
  cx.stroke();
  // ports at 4 corners
  [[x,y+14],[x,y+h-14],[x+w,y+14],[x+w,y+h-14]].forEach(function(pt){
    cx.beginPath();
    cx.arc(X(pt[0]),Y(pt[1]),D(4),0,Math.PI*2);
    cx.fillStyle='#0a0f18';
    cx.fill();
    cx.strokeStyle=C.plate;
    cx.lineWidth=D(1.4);
    cx.stroke();
  });
  t('PLATE HX · PHX-01',x+w/2,y-9,C.plate,8,'700');
  t('PHX',x+w/2,y+h/2-8,'#c7d2fe',9,'700');
  t('CHW ⇄ GLY',x+w/2,y+h/2+8,'#5b6db8',6.5,'600');
  // CHW / GLY fluid-side labels with IN/OUT port annotations
  cx.globalAlpha=(alpha||1)*0.85;
  cx.font='700 '+D(5.5)+'px "JetBrains Mono","Courier New",monospace';
  cx.textBaseline='top';
  cx.setLineDash([]);
  cx.textAlign='left';
  cx.fillStyle='rgba(56,189,248,0.85)';
  cx.fillText('CHW IN',X(x+4),Y(y+2));
  cx.textBaseline='bottom';
  cx.fillText('CHW OUT',X(x+4),Y(y+h-2));
  cx.textBaseline='top';
  cx.textAlign='right';
  cx.fillStyle='rgba(52,211,153,0.85)';
  cx.fillText('GLY IN',X(x+w-4),Y(y+2));
  cx.textBaseline='bottom';
  cx.fillText('GLY OUT',X(x+w-4),Y(y+h-2));
  cx.restore();
}

// ── V1 valve (3-way, charge/discharge/standby) ────────────────
function drawV1(vcx2,vcy,mode,alpha){
  var col=mode==='charge'?C.chg:mode==='discharge'?C.warm:'#475569';
  if(mode!=='standby') glow(vcx2,vcy,28,mode==='charge'?C.chg:C.warm,alpha*0.22);
  actuator(vcx2,vcy-18,col);
  cx.save();
  cx.globalAlpha=0.6+alpha*0.4;
  cx.fillStyle=col;
  cx.beginPath();
  cx.moveTo(X(vcx2-14),Y(vcy));
  cx.lineTo(X(vcx2),Y(vcy-10));
  cx.lineTo(X(vcx2),Y(vcy+10));
  cx.closePath();
  cx.fill();
  cx.beginPath();
  cx.moveTo(X(vcx2+14),Y(vcy));
  cx.lineTo(X(vcx2),Y(vcy-10));
  cx.lineTo(X(vcx2),Y(vcy+10));
  cx.closePath();
  cx.fill();
  cx.strokeStyle=col;
  cx.lineWidth=D(2);
  cx.setLineDash([]);
  cx.beginPath();
  cx.moveTo(X(vcx2),Y(vcy-10));
  cx.lineTo(X(vcx2),Y(vcy-18));
  cx.stroke();
  cx.beginPath();
  cx.arc(X(vcx2),Y(vcy),D(18),0,Math.PI*2);
  cx.strokeStyle=col;
  cx.lineWidth=D(1);
  cx.stroke();
  cx.beginPath();
  cx.arc(X(vcx2),Y(vcy),D(3.5),0,Math.PI*2);

// ── meter arc gauge ───────────────────────────────────────────
function drawMeterArc(x,y,r,val,mn,mx,tgt,cap,label){
  var a0=-148, a1=148;
  function ra(a){return (a-90)*Math.PI/180;}
  var fracVal=Math.min(1,Math.max(0,(val-mn)/(mx-mn)));
  var va=a0+(fracVal)*(a1-a0);
  var col=val>=cap-0.5?C.ret:val>=tgt?C.warm:C.cold;
  cx.save();

  // ── Outer ring with MW tick marks at 0, 8, 16, 24, 32 MW ────
  var rOuter=r+6;
  var tickMW=[0,8,16,24,32];
  tickMW.forEach(function(mw){
    var ta2=a0+((mw-mn)/(mx-mn))*(a1-a0);
    var ang2=(ta2-90)*Math.PI/180;
    var isMajor=mw===0||mw===32;
    var tickLen=isMajor?4.5:3;
    var r1=rOuter-tickLen, r2=rOuter+1;
    cx.strokeStyle=mw===32?C.ret:mw>=24?C.warm:'#1e3a5f';
    cx.lineWidth=D(isMajor?1.2:0.8);
    cx.setLineDash([]);
    cx.beginPath();
    cx.moveTo(X(x+r1*Math.cos(ang2)),Y(y+r1*Math.sin(ang2)));
    cx.lineTo(X(x+r2*Math.cos(ang2)),Y(y+r2*Math.sin(ang2)));
    cx.stroke();
    // tick value label
    if(mw===0||mw===32||mw===16){
      var labelR=rOuter+5;
      var lx=x+labelR*Math.cos(ang2);
      var ly=y+labelR*Math.sin(ang2);
      tm(String(mw),lx,ly,mw===32?C.ret:'#1e3a5f',4.5,'700');
    }
  });
  // outer ring arc (thin, decorative)
  cx.strokeStyle='#1a2d4a';
  cx.lineWidth=D(0.7);
  cx.setLineDash([]);
  cx.beginPath();
  cx.arc(X(x),Y(y),D(rOuter),ra(a0),ra(a1));
  cx.stroke();

  // ── Main arc track ────────────────────────────────────────────
  cx.strokeStyle='#0d1a2a';
  cx.lineWidth=D(9);
  cx.lineCap='round';
  cx.setLineDash([]);
  cx.beginPath();
  cx.arc(X(x),Y(y),D(r),ra(a0),ra(a1));
  cx.stroke();
  cx.strokeStyle=col;
  cx.beginPath();
  cx.arc(X(x),Y(y),D(r),ra(a0),ra(va));
  cx.stroke();
  var ta=a0+((tgt-mn)/(mx-mn))*(a1-a0);
  var tick_x=x+r*Math.cos((ta-90)*Math.PI/180);
  var tick_y=y+r*Math.sin((ta-90)*Math.PI/180);
  cx.strokeStyle=C.warm;
  cx.lineWidth=D(1.5);
  cx.beginPath();
  cx.moveTo(X(tick_x-3),Y(tick_y-3));
  cx.lineTo(X(tick_x+3),Y(tick_y+3));
  cx.stroke();
  cx.restore();
  tm(val.toFixed(1),x,y,col,20,'700');
  tm('MW',x+14,y+3,col,7,'700','left');
  t(label,x,y+18,'#2a3d5c',6.5,'600');
}

// ── CRAH wavy coil draw ───────────────────────────────────────
function drawCRAH(dcX,dcY,dcW,dcH,supCol){
  // mode label badge
  cx.save();
  cx.fillStyle='rgba(56,189,248,0.12)';
  cx.strokeStyle='rgba(56,189,248,0.4)';
  cx.lineWidth=D(0.8);
  cx.setLineDash([]);
  cx.beginPath();
  if(cx.roundRect){cx.roundRect(X(dcX+4),Y(dcY+20),D(dcW-8),D(10),D(2));}else{cx.rect(X(dcX+4),Y(dcY+20),D(dcW-8),D(10));}
  cx.fill(); cx.stroke();
  cx.restore();
  t('AIR COOLING · CRAH',dcX+dcW/2,dcY+25,'#38bdf8',6,'700');
  // 3 wavy coil rows with better amplitude and contrast
  var coilRows=3;
  var coilStartY=dcY+34;
  var coilSpacing=(dcH-60)/coilRows;
  cx.save();
  for(var ci=0;ci<coilRows;ci++){
    var cy2=coilStartY+ci*coilSpacing+coilSpacing/2;
    // supply side (cold, blue)
    cx.strokeStyle=supCol;
    cx.lineWidth=D(2);
    cx.setLineDash([]);
    cx.beginPath();
    var steps=72;
    for(var si=0;si<=steps;si++){
      var px=dcX+6+(dcW-12)*si/steps;
      var py=cy2+4*Math.sin(si/steps*Math.PI*6);
      if(si===0) cx.moveTo(X(px),Y(py));
      else cx.lineTo(X(px),Y(py));
    }
    cx.stroke();
    // warm return highlight (thin, red, offset by half-period)
    cx.strokeStyle='rgba(248,113,113,0.35)';
    cx.lineWidth=D(0.8);
    cx.beginPath();
    for(var si2=0;si2<=steps;si2++){
      var px2=dcX+6+(dcW-12)*si2/steps;
      var py2=cy2-4*Math.sin(si2/steps*Math.PI*6);
      if(si2===0) cx.moveTo(X(px2),Y(py2));
      else cx.lineTo(X(px2),Y(py2));
    }
    cx.stroke();
  }
  cx.restore();
  // 3 airflow arrows (upward, larger)
  var arrowSpacing=(dcW-20)/3;
  for(var ai=0;ai<3;ai++){
    var ax=dcX+10+ai*arrowSpacing+arrowSpacing/2;
    var ay=dcY+dcH-14;
    cx.save();
    cx.fillStyle='rgba(148,163,184,0.55)';
    cx.beginPath();
    cx.moveTo(X(ax),Y(ay+6));
    cx.lineTo(X(ax-5),Y(ay-1));
    cx.lineTo(X(ax-2),Y(ay-1));
    cx.lineTo(X(ax-2),Y(ay-8));
    cx.lineTo(X(ax+2),Y(ay-8));
    cx.lineTo(X(ax+2),Y(ay-1));
    cx.lineTo(X(ax+5),Y(ay-1));
    cx.closePath();
    cx.fill();
    cx.restore();
  }
}

// ── graph dirty flag + cached samples ────────────────────────
var graphDirty=true, cachedSamples=[], cachedYMin=0, cachedYMax=CAP+0.5;

function recomputeGraphSamples(){
  cachedSamples=[];
  for(var si=0;si<=96;si++){
    var hh2=si*0.25;
    var sv=state(hh2);
    cachedSamples.push({h:hh2, meter:sv.meter});
  }
  var minMW=cachedSamples.reduce(function(a,s){return Math.min(a,s.meter);},99);
  var maxMW=cachedSamples.reduce(function(a,s){return Math.max(a,s.meter);},0);
  var yPad=(maxMW-minMW)*0.12;
  cachedYMin=Math.max(0,minMW-yPad);
  cachedYMax=maxMW+yPad;
  if(CAP<=cachedYMax*1.2) cachedYMax=CAP+0.5;
  graphDirty=false;
}

// ── graph draw function ───────────────────────────────────────
function drawGraph(h,st){
  if(graphDirty) recomputeGraphSamples();
  var samples=cachedSamples;
  var yMin=cachedYMin, yMax=cachedYMax;

  var W=gcv.width, H=gcv.height;
  var marginL=42, marginR=16, marginT=18, marginB=32;
  var gW=W-marginL-marginR, gH=H-marginT-marginB;
  function gX(hour){ return marginL + (hour/24)*gW; }
  function gY(mw){ return marginT + gH - ((mw-yMin)/(yMax-yMin))*gH; }

  // ── Layer 0: Background fill + vignette ──────────────────────
  gx.fillStyle='#070b12';
  gx.fillRect(0,0,W,H);
  var vig=gx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,0.30)');
  gx.fillStyle=vig;
  gx.fillRect(0,0,W,H);

  // ── Layer 1: Window shading bands with soft edges ─────────────
  function drawBand(hStart,hEnd,rgba){
    var edgeW=0.5; // fade-in width in hours
    // Build a horizontal gradient that fades in/out at edges
    var x0=gX(hStart), x1=gX(hEnd);
    var bandGrad=gx.createLinearGradient(x0,0,x1,0);
    var edgeFrac=edgeW/(hEnd-hStart);
    bandGrad.addColorStop(0,'rgba(0,0,0,0)');
    bandGrad.addColorStop(Math.min(edgeFrac,0.45),rgba);
    bandGrad.addColorStop(Math.max(1-edgeFrac,0.55),rgba);
    bandGrad.addColorStop(1,'rgba(0,0,0,0)');
    gx.fillStyle=bandGrad;
    gx.fillRect(x0,marginT,x1-x0,gH);
  }
  // Charge: 0..8
  drawBand(0,8,'rgba(96,165,250,0.06)');
  // Charge: 22..24
  drawBand(22,24,'rgba(96,165,250,0.06)');
  // Discharge: 12..20
  drawBand(12,20,'rgba(52,211,153,0.06)');
  // Top cap lines on each band
  gx.save();
  gx.lineWidth=1;
  gx.setLineDash([]);
  // charge bands top line
  gx.strokeStyle='rgba(96,165,250,0.30)';
  gx.beginPath(); gx.moveTo(gX(0),marginT+2); gx.lineTo(gX(8),marginT+2); gx.stroke();
  gx.beginPath(); gx.moveTo(gX(22),marginT+2); gx.lineTo(gX(24),marginT+2); gx.stroke();
  // discharge band top line
  gx.strokeStyle='rgba(52,211,153,0.30)';
  gx.beginPath(); gx.moveTo(gX(12),marginT+2); gx.lineTo(gX(20),marginT+2); gx.stroke();
  gx.restore();

  // ── Layer 2: Horizontal grid lines ───────────────────────────
  // Compute clean Y tick step
  var yRange=yMax-yMin;
  var rawStep=yRange/4;
  var step;
  if(rawStep<=1) step=1;
  else if(rawStep<=2.5) step=2;
  else step=5;
  // Build tick list
  var yTicks=[];
  var tickStart=Math.ceil(yMin/step)*step;
  for(var ti=tickStart;ti<=yMax+0.001;ti+=step){
    if(ti>=yMin-0.001) yTicks.push(parseFloat(ti.toFixed(2)));
  }
  gx.save();
  gx.strokeStyle='#14213a';
  gx.lineWidth=0.5;
  gx.setLineDash([]);
  gx.font='400 7px "JetBrains Mono","Courier New",monospace';
  gx.fillStyle='#2a3d5c';
  gx.textAlign='right';
  gx.textBaseline='middle';
  yTicks.forEach(function(mw){
    var gy=gY(mw);
    if(gy<marginT||gy>marginT+gH+1) return;
    gx.beginPath();
    gx.moveTo(marginL,gy);
    gx.lineTo(marginL+gW,gy);
    gx.stroke();
    gx.fillText(mw.toFixed(1),marginL-4,gy);
  });
  gx.restore();

  // ── Layer 3a: Phase fill under the curve (charge + discharge) ─
  // Charge phase: 0..8
  function phaseAreaFill(hA,hB,fillColor){
    var seg=[];
    for(var si2=0;si2<samples.length;si2++){
      var sh=samples[si2].h;
      if(sh>=hA-0.001&&sh<=hB+0.001) seg.push(samples[si2]);
    }
    if(seg.length<2) return;
    gx.save();
    gx.beginPath();
    gx.moveTo(gX(seg[0].h),gY(seg[0].meter));
    for(var si3=1;si3<seg.length;si3++){
      var p0b=si3>1?seg[si3-2]:seg[si3-1];
      var p1b=seg[si3-1];
      var p2b=seg[si3];
      var p3b=si3<seg.length-1?seg[si3+1]:p2b;
      var cp1xb=gX(p1b.h+(p2b.h-p0b.h)/6);
      var cp1yb=gY(p1b.meter+(p2b.meter-p0b.meter)/6);
      var cp2xb=gX(p2b.h-(p3b.h-p1b.h)/6);
      var cp2yb=gY(p2b.meter-(p3b.meter-p1b.meter)/6);
      gx.bezierCurveTo(cp1xb,cp1yb,cp2xb,cp2yb,gX(p2b.h),gY(p2b.meter));
    }
    gx.lineTo(gX(hB),gY(yMin));
    gx.lineTo(gX(hA),gY(yMin));
    gx.closePath();
    gx.fillStyle=fillColor;
    gx.fill();
    gx.restore();
  }
  phaseAreaFill(0,8,'rgba(96,165,250,0.10)');
  phaseAreaFill(12,20,'rgba(52,211,153,0.10)');

  // ── Layer 3b: Smooth filled area chart (Catmull-Rom) ─────────
  gx.save();
  var areaGrad=gx.createLinearGradient(0,marginT,0,marginT+gH);
  areaGrad.addColorStop(0,'rgba(56,189,248,0.28)');
  areaGrad.addColorStop(1,'rgba(56,189,248,0.04)');
  gx.fillStyle=areaGrad;

  gx.beginPath();
  gx.moveTo(gX(samples[0].h),gY(samples[0].meter));
  for(var ci=0;ci<samples.length-1;ci++){
    var p0=ci>0?samples[ci-1]:samples[ci];
    var p1=samples[ci];
    var p2=samples[ci+1];
    var p3=ci<samples.length-2?samples[ci+2]:p2;
    var cp1x=gX(p1.h+(p2.h-p0.h)/6);
    var cp1y=gY(p1.meter+(p2.meter-p0.meter)/6);
    var cp2x=gX(p2.h-(p3.h-p1.h)/6);
    var cp2y=gY(p2.meter-(p3.meter-p1.meter)/6);
    gx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,gX(p2.h),gY(p2.meter));
  }
  gx.lineTo(gX(24),gY(yMin));
  gx.lineTo(gX(0),gY(yMin));
  gx.closePath();
  gx.fill();

  // Stroke the top curve
  gx.beginPath();
  gx.moveTo(gX(samples[0].h),gY(samples[0].meter));
  for(var ci2=0;ci2<samples.length-1;ci2++){
    var q0=ci2>0?samples[ci2-1]:samples[ci2];
    var q1=samples[ci2];
    var q2=samples[ci2+1];
    var q3=ci2<samples.length-2?samples[ci2+2]:q2;
    var qcp1x=gX(q1.h+(q2.h-q0.h)/6);
    var qcp1y=gY(q1.meter+(q2.meter-q0.meter)/6);
    var qcp2x=gX(q2.h-(q3.h-q1.h)/6);
    var qcp2y=gY(q2.meter-(q3.meter-q1.meter)/6);
    gx.bezierCurveTo(qcp1x,qcp1y,qcp2x,qcp2y,gX(q2.h),gY(q2.meter));
  }
  gx.strokeStyle='#38bdf8';
  gx.lineWidth=1.8;
  gx.setLineDash([]);
  gx.shadowBlur=4;
  gx.shadowColor='#38bdf8';
  gx.stroke();
  gx.shadowBlur=0;
  gx.restore();

  // ── Layer 4: Reference lines ──────────────────────────────────
  gx.save();
  gx.font='700 6.5px "JetBrains Mono","Courier New",monospace';
  gx.textBaseline='middle';
  gx.textAlign='left';
  var refLabelX=marginL+gW+2;

  function drawRefLine(mwVal,strokeCol,alpha,dash,labelTxt){
    if(mwVal<yMin-0.1||mwVal>yMax+0.1) return;
    var ry=gY(mwVal);
    gx.save();
    gx.globalAlpha=alpha;
    gx.strokeStyle=strokeCol;
    gx.lineWidth=0.8;
    gx.setLineDash(dash);
    gx.beginPath(); gx.moveTo(marginL,ry); gx.lineTo(marginL+gW,ry); gx.stroke();
    gx.restore();
    // label pill
    gx.save();
    gx.globalAlpha=1;
    gx.font='700 6px "JetBrains Mono","Courier New",monospace';
    var tw2=gx.measureText(labelTxt).width;
    var pW=tw2+8, pH=10, pX=refLabelX, pY=ry-pH/2;
    gx.fillStyle='rgba(7,11,18,0.90)';
    gx.beginPath();
    if(gx.roundRect) gx.roundRect(pX,pY,pW,pH,2);
    else gx.rect(pX,pY,pW,pH);
    gx.fill();
    gx.strokeStyle=strokeCol; gx.lineWidth=0.8; gx.globalAlpha=0.6; gx.stroke();
    gx.globalAlpha=1; gx.fillStyle=strokeCol;
    gx.textAlign='left'; gx.textBaseline='middle';
    gx.fillText(labelTxt,pX+4,ry);
    gx.restore();
  }

  // Site cap
  if(CAP>=yMin&&CAP<=yMax+1){
    var capRy=gY(CAP);
    gx.save();
    gx.globalAlpha=0.7;
    gx.strokeStyle=C.ret;
    gx.lineWidth=1;
    gx.setLineDash([]);
    gx.beginPath(); gx.moveTo(marginL,capRy); gx.lineTo(marginL+gW,capRy); gx.stroke();
    gx.restore();
    gx.save();
    gx.font='700 6px "JetBrains Mono","Courier New",monospace';
    var capLbl='CAP 32 MW';
    var ctw=gx.measureText(capLbl).width;
    var cpW=ctw+8, cpH=10, cpX=refLabelX, cpY=capRy-cpH/2;
    gx.fillStyle='rgba(7,11,18,0.90)'; gx.beginPath();
    if(gx.roundRect) gx.roundRect(cpX,cpY,cpW,cpH,2); else gx.rect(cpX,cpY,cpW,cpH);
    gx.fill(); gx.strokeStyle=C.ret; gx.lineWidth=0.8; gx.globalAlpha=0.6; gx.stroke();
    gx.globalAlpha=1; gx.fillStyle=C.ret; gx.textAlign='left'; gx.textBaseline='middle';
    gx.fillText(capLbl,cpX+4,capRy);
    gx.restore();
  }
  // IT load line
  drawRefLine(itLoad,'#38bdf8',0.4,[4,3],'IT LOAD');
  // Min load line (IT + 2.5 chiller floor)
  drawRefLine(itLoad+2.5,'#fbbf24',0.4,[3,4],'MIN LOAD');
  gx.restore();

  // ── Layer 5: Transition markers ───────────────────────────────
  var transitions=[
    {hv:8,  col:'#60a5fa', line1:'STANDBY',     line2:'charge complete · ambient rising'},
    {hv:12, col:'#34d399', line1:'DISCHARGE ▶', line2:'peak demand · TES relief active'},
    {hv:20, col:'#fbbf24', line1:'RECOVER',      line2:'peak passes · chiller takes over'},
    {hv:22, col:'#60a5fa', line1:'◄ CHARGE', line2:'off-peak · efficient COP'}
  ];

  // Pre-measure pills to avoid overlap — pills sit at top of graph
  var pillInfos=[];
  gx.save();
  transitions.forEach(function(tr){
    gx.font='700 7.5px "JetBrains Mono","Courier New",monospace';
    var w1=gx.measureText(tr.line1).width;
    gx.font='400 6px "Outfit","Segoe UI",sans-serif';
    var w2=gx.measureText(tr.line2).width;
    var pillW2=Math.max(Math.max(w1,w2)+14, 68);
    var pillH2=22;
    pillInfos.push({w:pillW2,h:pillH2});
  });
  gx.restore();

  transitions.forEach(function(tr,ti){
    var tx=gX(tr.hv);
    var dotY=gY(state(tr.hv).meter);
    var pInfo=pillInfos[ti];
    var pillCX=tx;
    // Clamp pill so it doesn't go outside the graph
    var pillLeft=pillCX-pInfo.w/2;
    var pillRight=pillCX+pInfo.w/2;
    if(pillLeft<marginL) pillCX=marginL+pInfo.w/2;
    if(pillRight>marginL+gW) pillCX=marginL+gW-pInfo.w/2;
    var pillTop=marginT+8;

    // 1. Vertical accent line
    gx.save();
    gx.strokeStyle=tr.col;
    gx.lineWidth=1;
    gx.globalAlpha=0.5;
    gx.setLineDash([2,3]);
    gx.beginPath();
    gx.moveTo(tx,marginT);
    gx.lineTo(tx,marginT+gH);
    gx.stroke();
    gx.restore();

    // 2. Connector from dot up to pill bottom
    var pillBottom=pillTop+pInfo.h;
    if(dotY>pillBottom){
      gx.save();
      gx.strokeStyle=tr.col;
      gx.lineWidth=0.7;
      gx.globalAlpha=0.4;
      gx.setLineDash([]);
      gx.beginPath();
      gx.moveTo(tx,dotY-5);
      gx.lineTo(tx,pillBottom+1);
      gx.stroke();
      gx.restore();
    }

    // 3. Pill label
    gx.save();
    gx.fillStyle='rgba(7,11,18,0.92)';
    gx.beginPath();
    if(gx.roundRect) gx.roundRect(pillCX-pInfo.w/2,pillTop,pInfo.w,pInfo.h,3);
    else gx.rect(pillCX-pInfo.w/2,pillTop,pInfo.w,pInfo.h);
    gx.fill();
    gx.strokeStyle=tr.col; gx.lineWidth=1; gx.globalAlpha=0.6; gx.stroke();
    gx.globalAlpha=1;
    // Line1 — bold mono
    gx.font='700 7.5px "JetBrains Mono","Courier New",monospace';
    gx.fillStyle=tr.col;
    gx.textAlign='center'; gx.textBaseline='middle';
    gx.fillText(tr.line1, pillCX, pillTop+7);
    // Line2 — regular outfit
    gx.font='400 6px "Outfit","Segoe UI",sans-serif';
    gx.fillStyle='rgba(255,255,255,0.45)';
    gx.fillText(tr.line2, pillCX, pillTop+16);
    gx.restore();

    // 4. Dot on curve
    gx.save();
    // Outer ring
    gx.strokeStyle=tr.col; gx.lineWidth=1; gx.globalAlpha=0.6; gx.setLineDash([]);
    gx.beginPath(); gx.arc(tx,dotY,5,0,Math.PI*2); gx.stroke();
    // Inner dot
    gx.globalAlpha=0.9; gx.fillStyle=tr.col;
    gx.beginPath(); gx.arc(tx,dotY,3,0,Math.PI*2); gx.fill();
    gx.restore();
  });

  // ── Layer 6: Now cursor ───────────────────────────────────────
  var nowX=gX(h);
  var nowY=gY(st.meter);
  // Clamp nowY within graph area
  nowY=Math.max(marginT,Math.min(marginT+gH,nowY));

  // Vertical line
  gx.save();
  gx.globalAlpha=0.5;
  gx.strokeStyle='#ffffff';
  gx.lineWidth=1.5;
  gx.setLineDash([]);
  gx.beginPath();
  gx.moveTo(nowX,marginT);
  gx.lineTo(nowX,marginT+gH);
  gx.stroke();
  gx.restore();

  // Outer ring
  gx.save();
  gx.globalAlpha=0.30;
  gx.strokeStyle='#ffffff';
  gx.lineWidth=1.5;
  gx.beginPath(); gx.arc(nowX,nowY,6,0,Math.PI*2); gx.stroke();
  gx.restore();

  // Inner dot
  gx.save();
  gx.globalAlpha=0.85;
  gx.fillStyle='#ffffff';
  gx.beginPath(); gx.arc(nowX,nowY,3,0,Math.PI*2); gx.fill();
  gx.restore();

  // Pill label
  var labelTxt=st.meter.toFixed(1)+' MW';
  gx.save();
  gx.font='700 8px "JetBrains Mono","Courier New",monospace';
  gx.textAlign='center';
  gx.textBaseline='middle';
  var tw=gx.measureText(labelTxt).width;
  var pillPad=5;
  var pillW=tw+pillPad*2;
  var pillH=13;
  var pillX=nowX-pillW/2;
  var pillY=Math.max(marginT+1, nowY-8-pillH);
  // clamp horizontally
  if(pillX<marginL) pillX=marginL;
  if(pillX+pillW>marginL+gW) pillX=marginL+gW-pillW;
  gx.fillStyle='rgba(7,11,18,0.95)';
  gx.beginPath();
  if(gx.roundRect) gx.roundRect(pillX,pillY,pillW,pillH,3);
  else gx.rect(pillX,pillY,pillW,pillH);
  gx.fill();
  gx.strokeStyle='rgba(255,255,255,0.40)'; gx.lineWidth=0.8; gx.stroke();
  gx.fillStyle='#ffffff';
  gx.fillText(labelTxt, pillX+pillW/2, pillY+pillH/2);
  gx.restore();

  // ── Layer 7: Axes labels ──────────────────────────────────────
  gx.save();
  gx.font='400 7px "JetBrains Mono","Courier New",monospace';
  gx.fillStyle='#2a3d5c';
  gx.textAlign='center';
  gx.textBaseline='top';
  gx.strokeStyle='#2a3d5c';
  gx.lineWidth=0.5;
  gx.setLineDash([]);

  // X axis ticks every 2h, labels only every 4h
  for(var th=0;th<=24;th+=2){
    var tx2=gX(th);
    gx.beginPath();
    gx.moveTo(tx2,marginT+gH);
    gx.lineTo(tx2,marginT+gH+3);
    gx.stroke();
    if(th%4===0){
      var hStr=String(th).padStart(2,'0')+':00';
      gx.fillText(hStr,tx2,marginT+gH+5);
    }
  }
  gx.restore();

  // Graph title
  gx.save();
  gx.font='700 7.5px "Outfit","Segoe UI",sans-serif';
  gx.fillStyle='#38bdf8';
  gx.textAlign='left';
  gx.textBaseline='top';
  gx.fillText('SITE METER LOAD',marginL,2);
  // subtitle
  gx.font='400 6px "JetBrains Mono","Courier New",monospace';
  gx.fillStyle='#2a3d5c';
  var titleW=gx.measureText('SITE METER LOAD').width;
  gx.font='400 6px "JetBrains Mono","Courier New",monospace';
  // measure title width with correct font
  gx.font='700 7.5px "Outfit","Segoe UI",sans-serif';
  var tw3=gx.measureText('SITE METER LOAD').width;
  gx.font='400 6px "JetBrains Mono","Courier New",monospace';
  gx.fillStyle='#2a3d5c';
  gx.fillText('MW / 24h', marginL+tw3+6, 3);
  gx.restore();
}

// ── main draw function ────────────────────────────────────────
function drawAll(h,st,fW,fG,fC){
  // background
  cx.fillStyle='#0d1117';
  cx.fillRect(0,0,cv.width,cv.height);

  // ── COMPONENT POSITIONS ──────────────────────────────────────
  // Main Meter: top-center (slightly wider to anchor diagram)
  var meterX=362, meterY=8, meterW=196, meterH=72;
  // Chiller Array: left zone upper
  var chillerX=18, chillerY=100, chillerW=160, chillerH=88;
  // Data Center: left zone lower
  var dcX=18, dcY=320, dcW=160, dcH=100;
  // Nostromo Chiller: right zone upper
  var nchX=542, nchY=100, nchW=160, nchH=80;
  // IceBricks TES: far right, tall tank
  var icesX=700, icesY=108, icesW=200, icesH=400;
  // Plate HX: interface area
  var hxX=400, hxY=220, hxW=110, hxH=88;
  // Valves
  var v1X=570, v1Y=310;
  var v2X=430, v2Y=270;

  // ── ZONE BACKGROUNDS ─────────────────────────────────────────
  // Interface / neutral zone (drawn first so zones paint over edges)
  rr(390,90,138,440,8,'rgba(148,163,184,0.025)','rgba(148,163,184,0.10)',0.8);

  // Data Centre zone (left) — outer border + inner halo
  rr(8,90,380,440,10,'rgba(30,58,138,0.05)','rgba(59,130,246,0.22)',1.2);
  rr(10,92,376,436,9,null,'rgba(59,130,246,0.07)',3);
  // zone label with backdrop
  cx.save(); cx.fillStyle='rgba(8,12,20,0.70)';
  cx.beginPath(); if(cx.roundRect){cx.roundRect(X(100),Y(96),D(196),D(14),D(3));}else{cx.rect(X(100),Y(96),D(196),D(14));} cx.fill(); cx.restore();
  cx.save(); cx.fillStyle='rgba(96,165,250,0.9)'; cx.font='700 '+D(10)+'px "Outfit","Segoe UI",system-ui,sans-serif';
  if('letterSpacing' in cx) cx.letterSpacing=D(0.08)+'px';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('◆  DATA CENTRE',X(198),Y(103)); cx.restore();

  // Nostromo IceBrick zone (right) — outer border + inner halo
  rr(530,90,382,440,10,'rgba(5,150,105,0.05)','rgba(52,211,153,0.2)',1.2);
  rr(532,92,378,436,9,null,'rgba(52,211,153,0.07)',3);
  // zone label with backdrop
  cx.save(); cx.fillStyle='rgba(8,12,20,0.70)';
  cx.beginPath(); if(cx.roundRect){cx.roundRect(X(600),Y(96),D(242),D(14),D(3));}else{cx.rect(X(600),Y(96),D(242),D(14));} cx.fill(); cx.restore();
  cx.save(); cx.fillStyle='rgba(52,211,153,0.9)'; cx.font='700 '+D(10)+'px "Outfit","Segoe UI",system-ui,sans-serif';
  if('letterSpacing' in cx) cx.letterSpacing=D(0.08)+'px';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('◆  NOSTROMO ICEBRICK SYSTEM',X(721),Y(103)); cx.restore();

  // ── MAIN METER BOX (top center) ──────────────────────────────
  // Outer glow behind meter box to anchor the diagram
  glow(meterX+meterW/2,meterY+meterH/2,meterW*0.65,'#1d4ed8',0.22);
  // Gradient fill for utility meter
  var meterGrad=cx.createLinearGradient(X(meterX),Y(meterY),X(meterX),Y(meterY+meterH));
  meterGrad.addColorStop(0,'rgba(29,78,216,0.12)');
  meterGrad.addColorStop(1,'rgba(6,12,24,1)');
  cx.save(); cx.fillStyle=meterGrad;
  cx.beginPath(); if(cx.roundRect){cx.roundRect(X(meterX),Y(meterY),D(meterW),D(meterH),D(6));}else{cx.rect(X(meterX),Y(meterY),D(meterW),D(meterH));} cx.fill(); cx.restore();
  rr(meterX,meterY,meterW,meterH,6,null,'#2563eb',2.0);
  // thin inner halo on meter box
  rr(meterX+1,meterY+1,meterW-2,meterH-2,5,null,'rgba(96,165,250,0.12)',2);
  // Utility grid entry line — thin dashed vertical entering from top of meter box
  cx.save();
  cx.strokeStyle='#fbbf24'; cx.lineWidth=D(2); cx.globalAlpha=0.55;
  cx.setLineDash([D(4),D(3)]);
  cx.beginPath();
  cx.moveTo(X(meterX+meterW/2),Y(meterY+2));
  cx.lineTo(X(meterX+meterW/2),Y(meterY+14));
  cx.stroke();
  cx.globalAlpha=1; cx.restore();
  // 'UTIL GRID' micro-label just inside top of meter box
  t('↓ UTIL GRID',meterX+meterW/2,meterY+6,'rgba(251,191,36,0.55)',5.5,'600');
  t('MAIN METER · M-01',meterX+meterW/2,meterY+11,'#93c5fd',11,'700');
  t('SITE CAP: 32 MW',meterX+meterW/2,meterY+23,'#1e3a5f',7,'600');
  // Meter arc gauge (compact, fits in box)
  drawMeterArc(meterX+meterW/2,meterY+50,22,st.meter,0,CAP,31.5,CAP,'METER MW');
  // freed caption
  if(st.freed>0.5){
    t('+'+st.freed.toFixed(1)+' MW freed',meterX+meterW/2,meterY+meterH-7,C.cold,7,'700');
  }

  // ── ELECTRICAL LINES FROM METER ──────────────────────────────
  // Meter bottom center → branch point → left zone (feeds chiller + DC)
  var mBotX=meterX+meterW/2;
  var mBotY=meterY+meterH;
  var branchY=mBotY+10;
  // Elbow left toward DC zone — thicker, more authoritative
  cx.save();
  cx.strokeStyle='#fbbf24';
  cx.lineWidth=D(2.8);
  cx.globalAlpha=0.70;
  cx.setLineDash([D(5),D(3)]);
  cx.beginPath();
  cx.moveTo(X(mBotX),Y(mBotY));
  cx.lineTo(X(mBotX-50),Y(branchY));
  cx.lineTo(X(98),Y(branchY));
  cx.lineTo(X(98),Y(chillerY));
  cx.stroke();
  cx.restore();
  // bolt symbol at branch point
  t('⚡',mBotX,mBotY+2,'#fbbf24',9,'700');
  // arrowhead at DC zone entry (C4)
  arrow(98,chillerY+4,Math.PI/2,'#fbbf24',4.5,0.70);

  // Elbow right toward Nostromo zone (charge-only) — thicker when charging
  cx.save();
  cx.strokeStyle=C.chg;
  cx.lineWidth=D(2.8);
  cx.globalAlpha=st.charging?0.90:0.13;
  cx.setLineDash([D(6),D(4)]);
  cx.lineDashOffset=-(fC*0.4);
  cx.beginPath();
  cx.moveTo(X(mBotX),Y(mBotY));
  cx.lineTo(X(mBotX+50),Y(branchY));
  cx.lineTo(X(nchX+nchW/2),Y(branchY));
  cx.lineTo(X(nchX+nchW/2),Y(nchY));
  cx.stroke();
  cx.restore();
  // arrowhead at Nostromo chiller entry (C4)
  if(st.charging) arrow(nchX+nchW/2,nchY+4,Math.PI/2,C.chg,4.5,0.90);

  // ── PIPE ROUTING ─────────────────────────────────────────────
  var aW=0.85;
  // Smooth alpha ramps: linearly interpolate over ±rampW hours at each transition boundary
  var rampW=0.25;
  function softRamp(hh,low,high,edgeH,risingToHigh){
    var d=hh-edgeH;
    if(d<-rampW) return risingToHigh?low:high;
    if(d> rampW) return risingToHigh?high:low;
    var frac=(d+rampW)/(2*rampW);
    return risingToHigh?low+(high-low)*frac:high+(low-high)*frac;
  }
  // Discharge: alpha rises at h=12, falls at h=20
  var aD;
  if(h<12-rampW||h>20+rampW){ aD=0.08; }
  else if(h>=12-rampW&&h<=12+rampW){ aD=softRamp(h,0.08,0.9,12,true); }
  else if(h>12+rampW&&h<20-rampW){ aD=0.9; }
  else { aD=softRamp(h,0.08,0.9,20,false); }
  // Charge: alpha is high when h<8 or h>=22, with ramps at boundaries
  var aC;
  if(h>8+rampW&&h<22-rampW){ aC=0.08; }
  else if(h<=8+rampW&&h>=8-rampW){ aC=softRamp(h,0.08,0.9,8,false); }
  else if(h>=22-rampW&&h<=22+rampW){ aC=softRamp(h,0.08,0.9,22,true); }
  else { aC=0.9; }

  // Supply (chiller outlet → down left side → DC supply port)
  // Chiller bottom-left → runs down → into DC top-left
  var chBotX=chillerX+20;
  var chBotY=chillerY+chillerH;
  var dcTopX=dcX+20;
  var dcTopY=dcY;
  pipe([[chBotX,chBotY],[chBotX,dcTopY-14],[dcTopX,dcTopY-14],[dcTopX,dcTopY]],C.sup,3.5,fW,aW);
  arrow(chBotX,(chBotY+dcTopY)/2,Math.PI/2,C.sup,4.5,aW);

  // Return (DC right → runs up → chiller return top-right)
  var dcRightX=dcX+dcW-20;
  var dcRightY=dcY;
  var chRightX=chillerX+chillerW-20;
  var chRightY=chillerY+chillerH;
  pipe([[dcRightX,dcRightY],[dcRightX,chRightY+20],[chRightX,chRightY+20],[chRightX,chRightY]],C.ret,3.5,fW*0.9,aW);
  arrow(dcRightX,(dcRightY+chRightY)/2,3*Math.PI/2,C.ret,4.5,aW);

  // Chiller supply runs right to HX top-left port
  var chOutX=chillerX+chillerW;
  var chOutY=chillerY+24;
  pipe([[chOutX,chOutY],[hxX,chOutY],[hxX,hxY+14]],C.sup,3.5,fW,aW);
  arrow((chOutX+hxX)/2,chOutY,0,C.sup,4.5,aW);

  // HX water out bottom-left → runs up and left back to chiller return header
  pipe([[hxX,hxY+hxH-14],[hxX,chRightY+20],[chRightX,chRightY+20]],C.ret,3.5,fW*0.9,aW*0.7);
  arrow((hxX+chRightX)/2,chRightY+20,Math.PI,C.ret,4.5,aW*0.7);

  // Glycol discharge: IceBricks cold port (left side) → V2 → HX right ports
  // IceBricks left port at (icesX, icesY + icesH*0.35) = (700,248)
  var icesPortColdY=icesY+icesH*0.35;
  var icesPortWarmY=icesY+icesH*0.65;
  // Cold glycol: IceBricks → V1 → route up to V2 → HX bottom-right
  pipe([[icesX,icesPortColdY],[v1X,icesPortColdY],[v1X,v1Y+18]],C.cold,3.5,fG,aD);
  arrow((icesX+v1X)/2,icesPortColdY,Math.PI,C.cold,4.5,aD);
  // V1 top → runs left to V2
  pipe([[v1X,v1Y-18],[v1X,v2Y],[v2X+18,v2Y]],C.cold,3.5,fG,aD);
  arrow(v1X,(v1Y-18+v2Y)/2,3*Math.PI/2,C.cold,4.5,aD);
  // V2 left → HX right bottom port
  pipe([[v2X-18,v2Y],[hxX+hxW,v2Y],[hxX+hxW,hxY+hxH-14]],C.mix,3.5,fG,aD);
  arrow((v2X-18+hxX+hxW)/2,v2Y,Math.PI,C.mix,4.5,aD);

  // HX warm glycol out top-right → runs down right side → back to IceBricks warm port
  pipe([[hxX+hxW,hxY+14],[hxX+hxW,icesPortWarmY-10],[icesX,icesPortWarmY]],C.warm,3.5,fG,aD*0.8);
  arrow(hxX+hxW,(hxY+14+icesPortWarmY)/2,Math.PI/2,C.warm,4.5,aD*0.8);

  // Charge loop: N.Chiller bottom → V1 bottom → IceBricks cold port
  var nchBotX=nchX+nchW/2;
  var nchBotY=nchY+nchH;
  pipe([[nchBotX,nchBotY],[nchBotX,v1Y],[v1X+18,v1Y]],C.chg,3.5,fC,aC);
  arrow(nchBotX,(nchBotY+v1Y)/2,Math.PI/2,C.chg,4.5,aC);
  // Warm return from IceBricks warm port → N.Chiller (charge loop return, use chg orange-blue tint)
  // Use a slightly warm-tinted chg color (lerpHex between chg and warm) to distinguish from discharge warm
  var chgRetCol=lerpHex(C.chg,C.warm,0.35); // ~warm-blue blend
  pipe([[icesX,icesPortWarmY+6],[nchX+nchW,icesPortWarmY+6],[nchX+nchW,nchBotY-10],[nchBotX,nchBotY-10],[nchBotX,nchBotY]],chgRetCol,3,fC*0.85,aC*0.7);
  arrow((icesX+nchX+nchW)/2,icesPortWarmY+6,Math.PI,chgRetCol,4.5,aC*0.7);

  // ── FLOW DOTS ────────────────────────────────────────────────
  // Supply: chiller outlet → down left side → DC supply port
  flowDots([[chBotX,chBotY],[chBotX,dcTopY-14],[dcTopX,dcTopY-14],[dcTopX,dcTopY]],C.sup,fW,aW,4);
  // Return: DC right → up → chiller return
  flowDots([[dcRightX,dcRightY],[dcRightX,chRightY+20],[chRightX,chRightY+20],[chRightX,chRightY]],C.ret,fW*0.9,aW,4);
  // Chiller supply → HX top-left
  flowDots([[chOutX,chOutY],[hxX,chOutY],[hxX,hxY+14]],C.sup,fW,aW,3);
  // Cold glycol: IceBricks → V1 → V2 → HX
  flowDots([[icesX,icesPortColdY],[v1X,icesPortColdY],[v1X,v1Y+18]],C.cold,fG,aD,3);
  flowDots([[v1X,v1Y-18],[v1X,v2Y],[v2X+18,v2Y]],C.cold,fG,aD,3);
  flowDots([[v2X-18,v2Y],[hxX+hxW,v2Y],[hxX+hxW,hxY+hxH-14]],C.mix,fG,aD,3);

  // These are near component inlet/outlet — not on the pipe midpoints
  pipeLabel('38°F GLY OUT',hxX+hxW+28,hxY+28,C.warm,aD*0.8);

  // ── C3: Efficiency banner (full-width thin rule + pill) ──────
  // thin horizontal rule across canvas
  cx.save();
  cx.globalAlpha=0.35;
  cx.strokeStyle='#14213a';
  cx.lineWidth=D(0.7);
  cx.setLineDash([]);
  cx.beginPath();
  cx.moveTo(X(0),Y(83));
  cx.lineTo(X(VW),Y(83));
  cx.stroke();
  cx.restore();
  // pill background
  var pue=(1+st.chEff/itLoad).toFixed(2);
  var freed2=st.freed.toFixed(1);
  var tesP=Math.round(st.soc*100);
  var pillTxt1='SITE EFFICIENCY  ·  PUE: ';
  var pillTxt2=pue;
  var pillTxt3='  ·  FREED: ';
  var pillTxt4=freed2+' MW';
  var pillTxt5='  ·  TES: ';
  var pillTxt6=tesP+'%';
  var effCx=460, effCy=83;
  cx.save();
  var fs6=D(6);
  // measure total width by summing each segment with its own font
  var seg=[
    {txt:pillTxt1,col:'#4a6680',mono:false},
    {txt:pillTxt2,col:C.cmd,mono:true},
    {txt:pillTxt3,col:'#4a6680',mono:false},
    {txt:pillTxt4,col:C.cold,mono:true},
    {txt:pillTxt5,col:'#4a6680',mono:false},
    {txt:pillTxt6,col:C.chg,mono:true}
  ];
  var totalW=0;
  seg.forEach(function(s){
    cx.font='700 '+fs6+'px "'+(s.mono?'JetBrains Mono","Courier New",monospace':'Outfit","Segoe UI",system-ui,sans-serif"');
    totalW+=cx.measureText(s.txt).width;
  });
  var epX=X(effCx)-totalW/2-D(10), epY=Y(effCy)-D(5);
  cx.beginPath();
  if(cx.roundRect){cx.roundRect(epX,epY,totalW+D(20),D(10),D(3));}
  else{cx.rect(epX,epY,totalW+D(20),D(10));}
  cx.fillStyle='rgba(8,12,20,0.90)';
  cx.fill();
  cx.strokeStyle='#1e3a5f'; cx.lineWidth=D(0.7); cx.setLineDash([]); cx.stroke();
  // draw segments
  cx.textAlign='left'; cx.textBaseline='middle';
  var curX=epX+D(10);
  seg.forEach(function(s){
    cx.font='700 '+fs6+'px "'+(s.mono?'JetBrains Mono","Courier New",monospace':'Outfit","Segoe UI",system-ui,sans-serif"');
    cx.fillStyle=s.col;
    cx.fillText(s.txt,curX,Y(effCy));
    curX+=cx.measureText(s.txt).width;
  });
  cx.restore();

  // ── C1: Ambient temperature display (top-right corner) ───────
  var ambX=870, ambY=22;
  // label 'AMBIENT'
  t('AMBIENT',ambX,ambY-7,'#2a3d5c',6,'600');
  // thermometer icon: vertical rectangle + circle at bottom
  var thX=ambX-18, thY=ambY-4, thW=5, thH=14;
  var tFrac=Math.max(0,Math.min(1,(st.T-64)/(ambientPeak-64)));
  var tCol=lerpHex(C.sup,C.ret,tFrac);
  cx.save();
  cx.strokeStyle=tCol; cx.lineWidth=D(0.8); cx.setLineDash([]);
  cx.beginPath();
  if(cx.roundRect){cx.roundRect(X(thX),Y(thY),D(thW),D(thH),D(2));}
  else{cx.rect(X(thX),Y(thY),D(thW),D(thH));}
  cx.fillStyle='rgba(8,12,20,0.8)'; cx.fill(); cx.stroke();
  // fill level
  var fillFracH=thH*tFrac;
  cx.fillStyle=colA(tCol,0.7);
  cx.fillRect(X(thX+1),Y(thY+thH-fillFracH-1),D(thW-2),D(fillFracH));
  // bulb circle at bottom
  cx.beginPath(); cx.arc(X(thX+thW/2),Y(thY+thH+2),D(3.5),0,Math.PI*2);
  cx.fillStyle=tCol; cx.fill();
  cx.restore();
  // temperature value
  tm(Math.round(st.T)+'°F',ambX,ambY,tCol,14,'700');
  cx.globalAlpha=1;

  // ── FOOTER / COLOR KEY ─────────────────────────────────────────
  var fkeys=[
    {col:C.sup,   label:'CHW SUPPLY'},
    {col:C.ret,   label:'CHW RETURN'},
    {col:C.cold,  label:'GLY COLD'},
    {col:C.warm,  label:'GLY WARM'},
    {col:C.chg,   label:'CHG LOOP'},
    {col:C.mix,   label:'GLY MIX'},
    {col:'#fbbf24',label:'GRID POWER'},
    {col:C.plate, label:'HX PLATE'}
  ];
  var fkStartX=12, fkY=543, fkSpacing=114;
  fkeys.forEach(function(fk,fi){
    var kx=fkStartX+fi*fkSpacing;
    cx.save();
    cx.fillStyle=fk.col;
    cx.fillRect(X(kx),Y(fkY-2),D(16),D(4));
    cx.restore();
    t(fk.label,kx+20,fkY,fk.col,7,'600','left');
  });
}

// ── HUD UPDATE ────────────────────────────────────────────────
function updateHUD(h,st){
  var hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  document.getElementById('clock').textContent=
    String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  var scrub2=document.getElementById('scrub');
  scrub2.value=Math.round(h/24*9999);

  var badge=document.getElementById('badge');
  var phases={
    charge:{text:'CHARGING',bg:'rgba(6,182,212,.15)',border:'#22d3ee',col:'#22d3ee'},
    discharge:{text:'DISCHARGING',bg:'rgba(20,184,166,.15)',border:'#14B8A6',col:'#14B8A6'},
    standby:{text:'STANDBY',bg:'rgba(255,255,255,.03)',border:'#14213a',col:'#14213a'},
    recover:{text:'RESETTING',bg:'rgba(249,115,22,.12)',border:'#f97316',col:'#f97316'}
  };
  var p=phases[st.phase]||phases.standby;
  badge.textContent=p.text;
  badge.style.background=p.bg;
  badge.style.borderColor=p.border;
  badge.style.color=p.col;
}

// ── ANIMATION LOOP ────────────────────────────────────────────
var fW=0, fG=0, fC=0;
var progress=0, playing=false, speed=2, last2=0;

function loop(now){
  requestAnimationFrame(loop);
  if(playing){
    var dt=(now-last2)/1000;
    last2=now;
    progress+=dt*speed*0.022;
    if(progress>=1) progress-=1;
  } else {
    last2=now;
  }
  fW+=0.38; fG+=0.35; fC+=0.32;

  var h=progress*24;
  var st=state(h);
  drawAll(h,st,fW,fG,fC);
  drawGraph(h,st);
  updateHUD(h,st);
}
requestAnimationFrame(loop);

// ── CONTROLS ──────────────────────────────────────────────────
var playbtn=document.getElementById('playbtn');
playbtn.addEventListener('click',function(){
  playing=!playing;
  playbtn.textContent=playing?'⏸ PAUSE':'▶ PLAY';
  if(playing) last2=performance.now();
});

function setSpeed(s){
  speed=s;
  ['s1btn','s2btn','s4btn'].forEach(function(id){
    var el=document.getElementById(id);
    el.style.color='#5b7bb8';
    el.style.borderColor='#1e3050';
  });
  var active=document.getElementById('s'+s+'btn');
  active.style.color='#a78bfa';
  active.style.borderColor='#3b2a6a';
}
document.getElementById('s1btn').addEventListener('click',function(){setSpeed(1);});
document.getElementById('s2btn').addEventListener('click',function(){setSpeed(2);});
document.getElementById('s4btn').addEventListener('click',function(){setSpeed(4);});

// scrub
var scrubEl=document.getElementById('scrub');
scrubEl.addEventListener('input',function(){
  progress=parseInt(this.value)/9999;
  if(!playing) last2=performance.now();
});

// sliders
var siEl=document.getElementById('si');
var saEl=document.getElementById('sa');
siEl.addEventListener('input',function(){
  itLoad=parseFloat(this.value);
  document.getElementById('li').textContent=itLoad.toFixed(1)+' MW';
  graphDirty=true;
});
saEl.addEventListener('input',function(){
  ambientPeak=parseInt(this.value);
  document.getElementById('la').textContent=ambientPeak+'°F';
  graphDirty=true;
});

// start playing after a brief pause
setTimeout(function(){
  playing=true;
  last2=performance.now();
  playbtn.textContent='⏸ PAUSE';
},600);

})();
</script>
