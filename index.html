<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nostromo · IceBrick System Schematic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: hsl(220 22% 6%); --bg2: hsl(220 20% 8%); --border: hsl(220 15% 16%);
    --cold: #4a90d8; --cold-bg: #061428; --hot: #e05030; --hot-bg: #1e0c06;
    --air-cold: #a0d8f0; --air-hot: #e08030;
    --orange: #d4690a; --blue: #2a6ab8; --inactive: #2a2e3a;
    --text-dim: #6a6d7a; --text-mid: #8a8d9a; --green: #22cc44;
    --mono: 'JetBrains Mono', monospace;
  }
  html, body { width:100%; height:100%; background:var(--bg); overflow:hidden; }
  body { display:flex; flex-direction:column; font-family:var(--mono); }

  /* ── CONTROLS ── */
  #controls {
    display:flex; align-items:center; gap:20px; padding:7px 18px;
    background:var(--bg2); border-bottom:1px solid var(--border);
    flex-shrink:0; min-height:42px;
  }
  .ctrl-label { font-size:10px; font-weight:700; letter-spacing:2px; color:var(--orange); white-space:nowrap; }
  .ctrl-label.blue { color:var(--blue); }
  .divider { width:1px; height:18px; background:var(--border); }
  .toggle-wrap { display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none; }
  .toggle-sub { font-size:10px; letter-spacing:1px; color:var(--text-dim); }
  .toggle-track { width:34px; height:18px; border-radius:9px; background:#2e3040; border:1px solid #44475a; position:relative; transition:background .2s,border-color .2s; cursor:pointer; }
  .toggle-track.on { background:var(--orange); border-color:#e07a20; }
  .toggle-thumb { width:12px; height:12px; border-radius:6px; background:#fff; position:absolute; top:3px; left:3px; transition:left .2s; }
  .toggle-track.on .toggle-thumb { left:17px; }
  .toggle-val { font-size:10px; letter-spacing:1px; color:var(--text-dim); min-width:28px; }
  .toggle-val.on { color:var(--orange); }
  .mode-btn { padding:3px 9px; border-radius:4px; cursor:pointer; font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:1px; text-transform:uppercase; background:transparent; color:#4a5060; border:1px solid #2a2e3a; transition:all .15s; }
  .mode-btn.active { background:var(--blue); color:#fff; border-color:#4a90d8; }
  .ctrl-hint { margin-left:auto; font-size:9px; color:#3a4050; letter-spacing:.5px; white-space:nowrap; }

  /* ── CANVAS ── */
  #canvas-wrap { flex:1; overflow:hidden; }
  svg#main { width:100%; height:100%; display:block; }

  /* ── ANIMATIONS ── */
  /* Fan spin — uses transform-box:fill-box so origin stays at shape center */
  .fan-rotor {
    transform-box: fill-box;
    transform-origin: center;
    animation: fan-spin 1.8s linear infinite;
  }
  .fan-rotor.slow { animation-duration: 2.2s; }
  @keyframes fan-spin { to { transform: rotate(360deg); } }
  @keyframes pulse-led { 0%,100%{opacity:1} 50%{opacity:.2} }
  .led-pulse { animation: pulse-led 2s ease-in-out infinite; }
</style>
</head>
<body>

<div id="controls">
  <span class="ctrl-label">COOLING MODE</span>
  <button class="mode-btn active" id="btn-dlc" onclick="toggleDLC()">DLC</button>
  <button class="mode-btn"        id="btn-air" onclick="toggleDLC()">AIR</button>
  <div class="divider"></div>
  <span class="ctrl-label blue">TES MODE</span>
  <button class="mode-btn active" id="btn-charge"    onclick="setMode('charge')">CHARGE</button>
  <button class="mode-btn"        id="btn-discharge" onclick="setMode('discharge')">DISCHARGE</button>
  <button class="mode-btn"        id="btn-support"   onclick="setMode('support')">SUPPORT</button>
  <div class="divider"></div>
  <span class="ctrl-label blue">TES TIE-IN</span>
  <button class="mode-btn active" id="btn-placement-pre"  onclick="setPlacement('pre')">PRE-COOLING</button>
  <button class="mode-btn"        id="btn-placement-post" onclick="setPlacement('post')">PARALLEL</button>
  <button class="mode-btn"        id="btn-placement-postcool" onclick="setPlacement('postcool')">POST-COOLING</button>

<script>
  let dlcMode = true;
  let tesMode = 'charge';
  let placementMode = 'pre';

  const hints = {
    'air-charge':    'Air Cooling — CRAHs circulate cold air  ·  IceBrick charging via Glycol Chiller',
    'air-discharge': 'Air Cooling — CRAHs circulate cold air  ·  IceBrick discharging cold through HX to DC loop',
    'air-support':   'Air Cooling — CRAHs circulate cold air  ·  IceBrick + Glycol Chiller simultaneously feeding HX',
    'dlc-charge':    'Direct Liquid Cooling — CDU feeds cold plates  ·  IceBrick charging via Glycol Chiller',
    'dlc-discharge': 'Direct Liquid Cooling — CDU feeds cold plates  ·  IceBrick discharging cold through HX',
    'dlc-support':   'Direct Liquid Cooling — CDU feeds cold plates  ·  IceBrick + Glycol Chiller both feeding HX',
  };

  function updateHint() {
    const base = hints[(dlcMode?'dlc':'air')+'-'+tesMode] || '';
    document.getElementById('hint-text').textContent = base;
  }

  function syncPlacementVisibility() {
    const symbolic = document.getElementById('placement-symbolic');
    if (symbolic) symbolic.style.display = 'block';

    const isPre      = placementMode === 'pre';
    const isBypass   = placementMode === 'post';
    const isPostcool = placementMode === 'postcool';

    const el = (id) => document.getElementById(id);
    if (el('dataSquarePre'))      el('dataSquarePre').style.display      = isPre      ? 'block' : 'none';
    if (el('zoomHxPre'))          el('zoomHxPre').style.display          = isPre      ? 'block' : 'none';
    if (el('cp-pipes'))           el('cp-pipes').style.display           = isPre      ? 'block' : 'none';
    if (el('cp-label-pre'))       el('cp-label-pre').style.display       = isPre      ? 'block' : 'none';
    if (el('zoomHxPost'))         el('zoomHxPost').style.display         = isBypass   ? 'block' : 'none';
    if (el('bypass-squares'))     el('bypass-squares').style.display     = isBypass   ? 'block' : 'none';
    if (el('bypass-cp-pipes'))    el('bypass-cp-pipes').style.display    = isBypass   ? 'block' : 'none';
    if (el('cp-label-bypass'))    el('cp-label-bypass').style.display    = isBypass   ? 'block' : 'none';
    if (el('postcool-squares'))   el('postcool-squares').style.display   = isPostcool ? 'block' : 'none';
    if (el('zoomHxPostcool'))     el('zoomHxPostcool').style.display     = isPostcool ? 'block' : 'none';
    if (el('cp-rect-postcool'))   el('cp-rect-postcool').style.display   = isPostcool ? 'block' : 'none';
    if (el('postcool-cp-pipes'))  el('postcool-cp-pipes').style.display  = isPostcool ? 'block' : 'none';
    if (el('cp-label-postcool'))  el('cp-label-postcool').style.display  = isPostcool ? 'block' : 'none';
    if (el('cp-rect-bg')) {
      el('cp-rect-bg').style.display = isPostcool ? 'none' : 'block';
      el('cp-rect-bg').setAttribute('stroke', isBypass ? '#00c8a0' : '#556072');
    }
  }

  function setPlacement(m) {
    placementMode = m;
    ['pre','post','postcool'].forEach(b =>
      document.getElementById('btn-placement-'+b).classList.toggle('active', b===m)
    );
    syncPlacementVisibility();
    updateHint();
  }

  function toggleDLC() {
    dlcMode = !dlcMode;
    document.getElementById('btn-dlc').classList.toggle('active', dlcMode);
    document.getElementById('btn-air').classList.toggle('active', !dlcMode);
    document.getElementById('pipes-air').style.display   = dlcMode ? 'none'  : 'block';
    document.getElementById('pipes-dlc').style.display   = dlcMode ? 'block' : 'none';
    const dtcComponents = document.getElementById('dtc-components');
    if (dtcComponents) dtcComponents.style.display = dlcMode ? 'block' : 'none';
    document.getElementById('crah-group').style.display  = dlcMode ? 'none'  : 'block';
    document.getElementById('dlc-group').style.display   = dlcMode ? 'block' : 'none';
    syncPlacementVisibility();
    updateHint();
  }

  function setMode(m) {
    tesMode = m;
    ['charge','discharge','support'].forEach(b =>
      document.getElementById('btn-'+b).classList.toggle('active', b===m)
    );
    document.getElementById('pipes-charge').style.display    = m==='charge'    ? 'block' : 'none';
    document.getElementById('pipes-discharge').style.display = m==='discharge' ? 'block' : 'none';
    document.getElementById('pipes-support').style.display   = m==='support'   ? 'block' : 'none';
    document.getElementById('valves-charge').style.display    = m==='charge'    ? 'block' : 'none';
    document.getElementById('valves-discharge').style.display = m==='discharge' ? 'block' : 'none';
    document.getElementById('valves-support').style.display   = m==='support'   ? 'block' : 'none';
    updateHint();
  }

  function setPlacement(m) {
    placementMode = m;
    ['pre','post','postcool'].forEach(b =>
      document.getElementById('btn-placement-'+b).classList.toggle('active', b===m)
    );
    syncPlacementVisibility();
    updateHint();
  }

  syncPlacementVisibility();
  updateHint();
</script>
</body>
</html>
